name: Release

# Builds Lantern for Linux, macOS and Windows and publishes a GitHub Release.
#
# Normal flow: bump the version with tools/bump-version.sh and merge that PR.
# When main's Cargo.toml names a version whose tag (vX.Y.Z) doesn't exist yet,
# this workflow builds it, creates the tag and publishes the release.
#
# Also supported:
# - pushing a tag vX.Y.Z by hand (it must match Cargo.toml at that commit);
# - running it from the Actions tab: builds the bundles as artifacts, and with
#   "publish" ticked, releases the version in Cargo.toml (recovery button).
#
# Asset names carry no version, so README links to
# releases/latest/download/<asset> always point at the newest release.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    # Branch pushes only; tag pushes ignore this filter.
    paths:
      - Cargo.toml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in Cargo.toml (creates its tag if missing)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match the `cef` pin in Cargo.toml.
  CEF_CRATE_VERSION: "154.5.0"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what to release
        id: plan
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)
          tag="v$version"
          build=true
          publish=false
          # Commit the tag points at on GitHub (peeled if annotated), if it exists.
          existing=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n1 | cut -f1)

          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              msg="Tag $GITHUB_REF_NAME was pushed, but Cargo.toml at that commit says version $version."
              msg+=" Delete the $GITHUB_REF_NAME tag (and its release, if one was created),"
              msg+=" then bump the version with tools/bump-version.sh and merge that pull request:"
              msg+=" the release publishes itself, no tag needed."
              echo "::error title=Tag does not match Cargo.toml::$msg"
              echo "### Release not built" >> "$GITHUB_STEP_SUMMARY"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # A push to main that changed Cargo.toml.
            if [[ -n "$existing" ]]; then
              build=false
              echo "$tag already exists, so there is nothing new to release." >> "$GITHUB_STEP_SUMMARY"
            else
              publish=true
            fi
          elif [[ "$PUBLISH_INPUT" == true ]]; then
            if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
              msg="$tag already points at ${existing:0:7}, not this commit (${GITHUB_SHA:0:7})."
              msg+=" Delete that tag and its release first, or bump the version."
              echo "::error title=Tag exists elsewhere::$msg"
              exit 1
            fi
            publish=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version: build=$build publish=$publish" >> "$GITHUB_STEP_SUMMARY"

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libglib2.0-dev ninja-build

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Set up CEF
        uses: ./.github/actions/setup-cef
        with:
          version: ${{ env.CEF_CRATE_VERSION }}

      - name: Cache bundle-cef-app
        id: bundler
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/bundle-cef-app
            ~/.cargo/bin/bundle-cef-app.exe
          key: bundle-cef-app-${{ env.CEF_CRATE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install bundle-cef-app
        if: steps.bundler.outputs.cache-hit != 'true'
        run: cargo install cef --version "=$CEF_CRATE_VERSION" --bin bundle-cef-app --locked

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          bundle-cef-app lantern -o dist/lantern --release
          tar -C dist -czf "lantern-${{ matrix.name }}.tar.gz" lantern

      # bundle-cef-app always uses the dev profile on macOS, so give that
      # profile release settings for this build.
      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "3"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "false"
          CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "false"
          CARGO_PROFILE_DEV_INCREMENTAL: "false"
        run: |
          bundle-cef-app lantern -o dist \
            -d Lantern \
            -i io.github.chrissnyder2337.lantern \
            -v "${{ needs.plan.outputs.version }}"
          # The bundle is named after the executable; give it the app's name.
          # CEF locates its framework and helpers relative to the executable.
          mv dist/lantern.app dist/Lantern.app
          # Apple silicon won't run unsigned code, and Gatekeeper reports an
          # unsigned or partly signed download as "damaged". An ad-hoc
          # signature over the whole bundle (helpers and CEF framework
          # included) turns that into the usual unidentified-developer prompt.
          codesign --force --deep --sign - dist/Lantern.app
          codesign --verify --deep --strict --verbose=2 dist/Lantern.app
          # ditto keeps the framework's symlinks intact.
          ditto -c -k --keepParent dist/Lantern.app "lantern-${{ matrix.name }}.zip"

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bundle-cef-app lantern -o dist/lantern --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/lantern -DestinationPath "lantern-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-${{ matrix.name }}
          path: |
            lantern-*.tar.gz
            lantern-*.zip
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.plan.outputs.tag }}
    needs: [plan, bundle]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum lantern-* > SHA256SUMS.txt

      # Creates the tag at this commit if it doesn't exist yet, and updates an
      # existing release for the tag rather than making a second one.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lantern ${{ needs.plan.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
