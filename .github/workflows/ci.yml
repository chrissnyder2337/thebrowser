name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, test, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libglib2.0-dev ninja-build

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # The cef-dll-sys build script downloads CEF and builds its C++ wrapper here.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --bin lantern

      - name: Bundle
        run: |
          cargo install cef --version "=154.5.0" --bin bundle-cef-app --locked
          bundle-cef-app lantern -o target/bundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-linux-x86_64
          path: target/bundle
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --bins --lib
