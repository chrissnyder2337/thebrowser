name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Tier-0 PRs merge through GITHUB_TOKEN auto-merge (tier.yml), and those
  # merges don't start push workflows, so main also gets a daily run.
  schedule:
    - cron: "41 5 * * *"

concurrency:
  # The event too, so the daily run doesn't cancel a push run on main.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match the `cef` pin in Cargo.toml.
  CEF_CRATE_VERSION: "154.5.0"

jobs:
  linux:
    name: Linux (fmt, clippy, test, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libglib2.0-dev ninja-build

      - uses: Swatinem/rust-cache@v2

      - name: Set up CEF
        uses: ./.github/actions/setup-cef
        with:
          version: ${{ env.CEF_CRATE_VERSION }}

      - name: Check formatting
        run: cargo fmt --check

      # cef-dll-sys builds its C++ wrapper against $CEF_PATH here.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The test binary links libcef.so. A warm rust-cache skips the build step
      # that copies CEF into target/, so load it from CEF_PATH instead.
      - name: Unit tests
        run: LD_LIBRARY_PATH="$CEF_PATH" cargo test --bin lantern

      - name: Cache bundle-cef-app
        id: bundler
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/bundle-cef-app
          key: bundle-cef-app-${{ env.CEF_CRATE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install bundle-cef-app
        if: steps.bundler.outputs.cache-hit != 'true'
        run: cargo install cef --version "=$CEF_CRATE_VERSION" --bin bundle-cef-app --locked

      - name: Bundle
        run: bundle-cef-app lantern -o target/bundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-linux-x86_64
          path: target/bundle
          retention-days: 7

      # The chrome and internal pages, and the retro scripts, for the
      # Playwright job (which has no CEF).
      - name: Dump pages
        run: LD_LIBRARY_PATH="$CEF_PATH" cargo run --example dump-pages -- target/pages

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-pages
          path: target/pages
          retention-days: 7

  playwright:
    name: Playwright (web layer, goldens)
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Must match @playwright/test in package.json (checked below), so golden
    # screenshots render as they do with tests/web/run.sh.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_IMAGE_VERSION: "1.64.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lantern-pages
          path: target/pages

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check the image matches package.json
        run: |
          pinned="$(node -p 'require("./package.json").devDependencies["@playwright/test"]')"
          installed="$(node -p 'require("@playwright/test/package.json").version')"
          if [ "$pinned" != "$PLAYWRIGHT_IMAGE_VERSION" ] || [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::package.json pins $pinned, installed $installed, image is $PLAYWRIGHT_IMAGE_VERSION"
            exit 1
          fi

      # HOME=/root: Firefox and Chromium in the image expect it when run as root.
      - name: Playwright tests
        run: HOME=/root npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  smoke:
    name: Bundle smoke test
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb

      - uses: actions/download-artifact@v8
        with:
          name: lantern-linux-x86_64
          path: target/bundle

      # Artifacts don't keep file modes.
      - name: Smoke test
        run: |
          chmod +x target/bundle/lantern target/bundle/*.so*
          tests/smoke.sh target/bundle

  # The oracle guard (tools/oracle-guard.sh): a PR that changes src/ or ui/
  # and also changes existing goldens, assertions, the test settings or the CI
  # definition needs the maintainer's approval on the "oracle" environment.
  # No label or input skips it.
  oracle-check:
    name: Oracle check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.guard.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run the guard
        id: guard
        env:
          BASE_REF: ${{ github.base_ref }}
        # The base branch's copy of the guard judges the PR, so a PR can't
        # loosen the guard that checks it (the PR's copy runs only until the
        # guard exists on the base branch).
        run: |
          guard="$RUNNER_TEMP/oracle-guard.sh"
          git show "origin/$BASE_REF:tools/oracle-guard.sh" > "$guard" 2>/dev/null || cp tools/oracle-guard.sh "$guard"
          if bash "$guard" "origin/$BASE_REF"; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "::warning::Existing oracle files changed; waiting for approval on the oracle environment."
            echo "result=changed" >> "$GITHUB_OUTPUT"
          fi

  oracle-approval:
    name: Oracle override (maintainer approval)
    needs: oracle-check
    if: needs.oracle-check.outputs.result == 'changed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: oracle
    steps:
      - run: echo "The maintainer approved the oracle change for ${{ github.sha }}."

  oracle-guard:
    name: Oracle guard
    needs: [oracle-check, oracle-approval]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Decide
        env:
          CHECK: ${{ needs.oracle-check.result }}
          RESULT: ${{ needs.oracle-check.outputs.result }}
          APPROVAL: ${{ needs.oracle-approval.result }}
        run: |
          echo "check=$CHECK result=$RESULT approval=$APPROVAL"
          if [ "$CHECK" = "success" ] && [ "$RESULT" = "clean" ]; then exit 0; fi
          if [ "$CHECK" = "success" ] && [ "$RESULT" = "changed" ] && [ "$APPROVAL" = "success" ]; then exit 0; fi
          echo "::error::Existing goldens, assertions, test settings or CI files changed together with src/ or ui/, without approval on the oracle environment (the Oracle check log lists them)."
          exit 1

  # The tier labeller's rules (.github/scripts/tier.py, run by tier.yml).
  tier-script:
    name: Tier script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: python3 -m unittest discover -s .github/scripts -v

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Set up CEF
        uses: ./.github/actions/setup-cef
        with:
          version: ${{ env.CEF_CRATE_VERSION }}

      - name: Build
        run: cargo build --bins --lib
