<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: #c0c0c0; color: #000;
    font: 11px "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Geneva, Verdana, sans-serif;
    -webkit-font-smoothing: none; font-smooth: never;
    cursor: default;
  }
  body { display: flex; align-items: center; gap: 2px; padding: 2px 2px 1px; border-top: 1px solid #fff; }
  .pane {
    height: 20px; flex: none; display: flex; align-items: center;
    box-shadow: inset 1px 1px #808080, inset -1px -1px #fff;
    padding: 0 5px;
  }
  #text { flex: 1; min-width: 0; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #meter-pane { width: 120px; padding: 3px; }
  #meter { width: 100%; height: 14px; display: flex; gap: 2px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 8px; height: 14px; flex: none; background: #000080; }
  #modem-pane { width: 64px; gap: 5px; padding: 0 4px; cursor: default; }
  #modem-pane:active { box-shadow: inset 1px 1px #000, inset -1px -1px #fff; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
  #lock-pane { width: 28px; justify-content: center; padding: 0; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
</style>
</head>
<body>
  <div class="pane" id="text"><span id="msg">Ready.</span></div>
  <div class="pane" id="modem-pane" role="button" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter"></div></div>
  <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
<script>
(function () {
  "use strict";
  var seq = 0;
  function send(cmd, arg) {
    seq += 1;
    document.title = "lantern|" + seq + "|" + cmd + "|" + encodeURIComponent(arg || "");
  }

  var msg = document.getElementById("msg");
  var meter = document.getElementById("meter");
  var lock = document.getElementById("lock-pane");
  var modem = document.getElementById("modem-pane");
  var modemLabel = document.getElementById("modem-label");
  modem.addEventListener("click", function () { send("settings"); });
  // 11 blocks of 8px + 2px gaps fill the 114px meter.
  var BLOCKS = 11;
  var shown = -1;

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dragstart", function (e) { e.preventDefault(); });
  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) { e.preventDefault(); });

  function setBlocks(n) {
    if (n === shown) return;
    shown = n;
    meter.textContent = "";
    for (var i = 0; i < n; i++) meter.appendChild(document.createElement("i"));
  }

  window.lantern = {
    update: function (s) {
      if ("text" in s) { msg.textContent = s.text; msg.parentNode.title = s.text; }
      if ("progress" in s) setBlocks(Math.round(Math.max(0, Math.min(1, s.progress)) * BLOCKS));
      if ("loading" in s) meter.classList.toggle("on", !!s.loading);
      if ("modem" in s) {
        modemLabel.textContent = s.modem;
        modem.classList.toggle("dialup", !!s.modem);
        modem.title = s.modemTip || "Dial-up simulator";
      }
      if ("secure" in s) {
        lock.classList.toggle("secure", !!s.secure);
        lock.title = s.secure ? "This page was delivered over a secure connection." : "";
      }
    }
  };

  send("ready");
})();
</script>
</body>
</html>
