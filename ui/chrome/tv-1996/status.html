<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Set-top TV (1996): a thin bar along the bottom of the screen (title,
     progress, Options key); with html.panel-open the Options panel of big
     rounded lozenge buttons grows above it (docs/ui-modes/modes.md). -->
<style>
  :root { --panel: #343a4a; --bar: #262a36; --loz: #aab4cc; --loz-hi: #d0d8ea; --loz-lo: #7e89a6; --ink: #1c2234; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--bar); color: #fff;
    font: bold 14px Helvetica, "Helvetica Neue", Arial, sans-serif; cursor: default;
  }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; outline: none; cursor: default; }
  svg { display: block; }

  /* ---- Lozenges ---- */
  .loz {
    height: 32px; padding: 0 14px; border-radius: 16px; color: var(--ink); white-space: nowrap;
    background: linear-gradient(var(--loz-hi), var(--loz) 55%, var(--loz-lo));
    box-shadow: 0 2px 3px rgba(0, 0, 0, .55), inset 0 1px rgba(255, 255, 255, .7);
    text-shadow: 0 1px rgba(255, 255, 255, .5);
  }
  .loz:active:not(.disabled):not(.inert) { transform: translateY(1px); box-shadow: 0 1px 1px rgba(0, 0, 0, .55); }
  .loz:focus-visible { outline: 2px solid #ffe000; outline-offset: 1px; }
  .loz.disabled, .loz.inert { opacity: .42; }

  /* ---- Options panel (closed by default) ---- */
  #panel {
    display: none; flex: 1; min-height: 0; flex-direction: column; justify-content: center; gap: 10px;
    padding: 0 18px; background: linear-gradient(#3c4356, var(--panel));
    border-top: 2px solid #5b647c; border-radius: 14px 14px 0 0;
  }
  html.panel-open #panel { display: flex; }
  .row { display: flex; gap: 8px; }
  .row .loz { flex: 1; padding: 0 6px; }
  #field { flex: 1; display: flex; align-items: center; gap: 8px; }
  #field label { flex: none; color: #ffe000; font-size: 15px; }
  #url {
    flex: 1; min-width: 0; height: 32px; padding: 0 14px; border: 0; border-radius: 16px;
    background: #e8ecf6; color: #101018; font: bold 14px Helvetica, Arial, sans-serif; outline: none;
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, .5);
  }
  #url:focus { box-shadow: inset 0 2px 3px rgba(0, 0, 0, .5), 0 0 0 2px #ffe000; }
  #go { flex: none; padding: 0 22px; }

  /* ---- Status bar ---- */
  #bar { height: 34px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 18px 0 14px; background: var(--bar); }
  #throbber { width: 20px; height: 29px; flex: none; overflow: hidden; }
  #throbber .scale { width: 32px; height: 48px; transform: scale(.6); transform-origin: 0 0; }
  #throbber .lit-box { width: 32px; height: 48px; overflow: hidden; display: none; }
  #throbber svg.lit { width: 128px; height: 48px; animation: flicker .6s steps(4) infinite; }
  @keyframes flicker { from { transform: translateX(0); } to { transform: translateX(-128px); } }
  #throbber.loading svg.idle { display: none; }
  #throbber.loading .lit-box { display: block; }
  #title { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #msgbox { flex: 0 1 190px; min-width: 0; font-size: 11px; font-weight: normal; color: #aab4cc; overflow: hidden; white-space: nowrap; }
  #msg { display: block; overflow: hidden; text-overflow: ellipsis; }
  #meter {
    width: 110px; height: 12px; flex: none; display: flex; overflow: hidden; visibility: hidden;
    border-radius: 6px; background: #0e1018; box-shadow: inset 0 1px 2px #000, 0 1px rgba(255, 255, 255, .18);
  }
  #meter.on { visibility: visible; }
  #meter i { width: 5%; height: 12px; flex: none; background: linear-gradient(#fff070, #e0b000); }
  #lock-pane, #modem-pane { flex: none; display: flex; align-items: center; gap: 4px; opacity: .6; font-size: 11px; font-weight: normal; }
  #lock-pane svg, #modem-pane svg { height: 16px; width: auto; }
  #lock-pane { display: none; }
  #lock-pane.secure { display: flex; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label:empty { display: none; }
  #opts { height: 26px; padding: 0 16px; border-radius: 13px; }
</style>
</head>
<body>
  <div id="panel">
    <div class="row">
      <button class="loz disabled" id="back" data-cmd="back" title="Go back (Alt+Left)">Back</button>
      <button class="loz disabled" id="forward" data-cmd="forward" title="Go forward (Alt+Right)">Forward</button>
      <button class="loz" id="home" data-cmd="home" title="Go to the start page (Alt+Home)">Home</button>
      <button class="loz" id="reload" data-cmd="reload" title="Reload this page (F5)">Reload</button>
      <button class="loz disabled" id="stop" data-cmd="stop" title="Stop loading (Esc)">Stop</button>
      <button class="loz" data-cmd="search" title="Search the web">Search</button>
      <button class="loz" data-cmd="bookmarks" title="Favorites">Favorites</button>
    </div>
    <div class="row">
      <div id="field"><label for="url">Go to</label><input id="url" type="text" spellcheck="false" autocomplete="off" title="Type an address (Ctrl+L)"><button class="loz" id="go" title="Go to this address">Go</button></div>
    </div>
    <div class="row">
      <button class="loz inert" title="Not available">Save</button>
      <button class="loz inert" title="Not available">Send</button>
      <button class="loz inert" title="Not available">Info</button>
      <button class="loz" data-cmd="search" title="Find on the web">Find</button>
      <button class="loz" data-cmd="menu" data-arg="setup" data-anchor aria-haspopup="menu" title="Text size and other settings">Text size</button>
      <button class="loz inert" title="Not available">Print</button>
      <button class="loz" data-cmd="menu" data-arg="setup" data-anchor aria-haspopup="menu" title="Setup">Setup</button>
    </div>
  </div>
  <div id="bar">
    <div id="throbber" title="About Lantern" role="button" aria-label="About Lantern"><div class="scale">{{LANTERN_IDLE}}<div class="lit-box">{{LANTERN_LIT}}</div></div></div>
    <span id="title"></span>
    <div id="msgbox"><span id="msg">Ready.</span></div>
    <div id="meter" data-blocks="20"></div>
    <div id="lock-pane" title="">{{ICON_LOCK}}</div>
    <div id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
    <button class="loz" id="opts" data-cmd="panel" title="Options">Options</button>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
