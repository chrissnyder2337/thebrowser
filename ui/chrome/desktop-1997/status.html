<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Desktop (1997): status bar of sunken panes: page icon and message,
     progress, dial-up speed, padlock and the zone pane (docs/ui-modes/modes.md). -->
<style>
  :root { --face: #c0c0c0; --pane: inset 1px 1px #808080, inset -1px -1px #fff; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 11px Tahoma, "MS Sans Serif", Arial, sans-serif;
    cursor: default;
  }
  body { display: flex; gap: 2px; padding: 2px 2px 0; }
  .pane { height: 20px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; box-shadow: var(--pane); }
  #text { flex: 1; min-width: 0; }
  #text svg { flex: none; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #meter-pane { width: 120px; padding: 3px; }
  #meter { width: 100%; height: 12px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 8px; height: 12px; flex: none; background: #000080; }
  #modem-pane { display: none; min-width: 60px; }
  #modem-pane.dialup { display: flex; }
  #modem-pane svg { display: none; }
  #modem-label { white-space: nowrap; }
  #lock-pane { width: 24px; justify-content: center; padding: 0; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
  #zone-pane { width: 120px; }
  #zone-pane svg { flex: none; }
  #zone-pane svg.off { display: none; }
  #zone-pane span { white-space: nowrap; }
</style>
</head>
<body>
  <div class="pane" id="text">{{ICON_PAGE}}<span id="msg">Done</span></div>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="12"></div></div>
  <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
  <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
  <div class="pane" id="zone-pane" title="Internet zone">{{ICON_D97_GLOBE}}<span>Internet zone</span></div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
