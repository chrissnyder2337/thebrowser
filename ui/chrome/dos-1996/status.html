<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- DOS graphics (1996): one bottom line, a sunken status field with a clock
     pane at the right end (docs/ui-modes/modes.md). The clock text is
     decoration. -->
<style>
  :root {
    --face: #c0c0c0;
    --down: inset 1px 1px #808080, inset -1px -1px #fff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 14px Arial, Helvetica, sans-serif; cursor: default;
  }
  body { display: flex; gap: 2px; padding: 1px 0 0; box-shadow: inset 0 1px #fff; }
  .pane { height: 19px; flex: none; display: flex; align-items: center; padding: 0 4px; box-shadow: var(--down); }
  #text { flex: 1; min-width: 0; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 16px; }
  #meter-pane { width: 104px; padding: 3px 4px; }
  #meter { width: 100%; height: 11px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 8px; height: 11px; flex: none; background: #000; }
  #lock-pane { width: 24px; justify-content: center; padding: 0; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
  #modem-pane { gap: 4px; }
  #modem-pane:active { box-shadow: inset 1px 1px #fff, inset -1px -1px #808080; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
  #clock { width: 76px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="pane" id="text"><span id="msg">Ready.</span></div>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="10"></div></div>
  <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
  <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
  <div class="pane" id="clock" title="Decoration">23:06:45</div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
