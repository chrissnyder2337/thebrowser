<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Classic desktop (1994): the bottom edge of the document window, where the
     scroll bar row sat: status text, progress, and small Stop and Reload
     buttons (Mac menus held those; the contract needs controls)
     (docs/ui-modes/modes.md). -->
<style>
  :root {
    --face: #ddd;
    --up: inset 1px 1px #fff, inset -1px -1px #888;
    --down: inset 1px 1px #888, inset -1px -1px #fff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: #a0a0a0; color: #000;
    font: 10px Geneva, "Lucida Grande", Helvetica, Arial, sans-serif;
    cursor: default;
  }
  body { padding: 0 10px; }
  button {
    font: inherit; color: inherit; background: var(--face);
    border: 0; margin: 0; padding: 0; outline: none;
  }
  #win {
    height: 18px; display: flex; align-items: center; gap: 4px; padding: 0 4px;
    background: var(--face); border: 1px solid #000; border-top: 0;
  }
  .pane { height: 14px; flex: none; display: flex; align-items: center; }
  #text { flex: 1; min-width: 0; padding: 0 2px; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #modem-pane { gap: 4px; padding: 0 3px; }
  #modem-pane:active { background: #aaa; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
  #meter-pane { width: 88px; height: 12px; padding: 1px; background: #fff; border: 1px solid #000; order: -1; }
  #meter { width: 100%; height: 8px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 5px; height: 8px; flex: none; background: #3355aa; }
  #lock-pane { width: 14px; justify-content: center; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
  .pb {
    flex: none; height: 14px; padding: 0 7px; white-space: nowrap; font-size: 10px; line-height: 12px;
    border: 1px solid #000; border-radius: 4px; box-shadow: var(--up);
  }
  .pb:active:not(.disabled) { background: #aaa; box-shadow: var(--down); }
  .pb:focus-visible { outline: 1px dotted #000; outline-offset: -3px; }
  .pb.disabled { color: #888; border-color: #888; }
</style>
</head>
<body>
  <div id="win">
    <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="14"></div></div>
    <div class="pane" id="text"><span id="msg">Ready.</span></div>
    <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
    <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
    <button class="pb disabled" id="stop" data-cmd="stop" title="Stop loading (Esc)">Stop</button>
    <button class="pb" id="reload" data-cmd="reload" title="Reload this page (F5)">Reload</button>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
