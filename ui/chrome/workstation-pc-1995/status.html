<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Workstation, PC (1995): a Windows 3.1 status bar of three sunken panes:
     message, progress meter, and a pane for the connection and lock icons
     (docs/ui-modes/modes.md). -->
<style>
  :root { --face: #c0c0c0; --pane: inset 1px 1px #808080, inset -1px -1px #fff; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 11px "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Arial, sans-serif;
    cursor: default;
  }
  body { display: flex; gap: 3px; padding: 3px 3px 0; border-top: 1px solid #000; }
  .pane { height: 20px; flex: none; display: flex; align-items: center; padding: 0 4px; box-shadow: var(--pane); }
  #text { flex: 1; min-width: 0; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #meter-pane { width: 150px; padding: 3px; }
  #meter { width: 100%; height: 12px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 8px; height: 12px; flex: none; background: #000080; }
  #net-pane { width: 150px; gap: 4px; padding: 0 2px; }
  #modem-pane { flex: 1; min-width: 0; height: 18px; display: flex; align-items: center; gap: 5px; padding: 0 2px; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
  #lock-pane { width: 22px; height: 18px; flex: none; display: flex; align-items: center; justify-content: center; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
</style>
</head>
<body>
  <div class="pane" id="text"><span id="msg">Ready</span></div>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="16"></div></div>
  <div class="pane" id="net-pane">
    <div id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
    <div id="lock-pane" title="">{{ICON_LOCK}}</div>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
