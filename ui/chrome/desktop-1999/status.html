<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Desktop (1999): a status bar of sunken panes: page icon and message,
     progress meter, security and zone (docs/ui-modes/modes.md). -->
<style>
  :root { --face: #c0c0c0; --pane: inset 1px 1px #808080, inset -1px -1px #fff; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 11px Tahoma, "MS Sans Serif", Arial, sans-serif;
    cursor: default;
  }
  body { display: flex; gap: 2px; padding: 2px 2px 0; border-top: 1px solid #fff; }
  .pane { height: 20px; flex: none; display: flex; align-items: center; padding: 0 5px; box-shadow: var(--pane); white-space: nowrap; }
  #text { flex: 1; min-width: 0; gap: 4px; }
  #text svg { flex: none; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #meter-pane { width: 120px; padding: 3px; }
  #meter { width: 100%; height: 12px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 8px; height: 12px; flex: none; background: #000080; }
  #modem-pane { gap: 5px; min-width: 30px; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #lock-pane { width: 24px; justify-content: center; padding: 0; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
  #zone { width: 96px; gap: 5px; }
  #zone i { width: 12px; height: 12px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #80b0f0, #2050a0 70%); box-shadow: 0 0 0 1px #000; }
</style>
</head>
<body>
  <div class="pane" id="text">{{ICON_PAGE}}<span id="msg">Done</span></div>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="13"></div></div>
  <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
  <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
  <div class="pane" id="zone" title="Internet zone"><i></i><span>Internet</span></div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
