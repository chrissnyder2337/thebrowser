<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Toolbar</title>
<!-- Desktop (1999): a menu band with a small activity box at its right end,
     a Standard Buttons band of flat colour buttons with labels, and an
     Address band with a Go button and a collapsed Links band
     (docs/ui-modes/modes.md). -->
<style>
  :root {
    --face: #c0c0c0;
    --thin: inset 1px 1px #fff, inset -1px -1px #808080;
    --thin-down: inset 1px 1px #808080, inset -1px -1px #fff;
    --sunken: inset 1px 1px #808080, inset -1px -1px #fff, inset 2px 2px #000, inset -2px -2px #dfdfdf;
    --raised: inset 1px 1px #fff, inset -1px -1px #000, inset 2px 2px #dfdfdf, inset -2px -2px #808080;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 11px Tahoma, "MS Sans Serif", Arial, sans-serif;
    cursor: default;
  }
  body { display: flex; flex-direction: column; }
  button {
    font: inherit; color: inherit; background: var(--face);
    border: 0; margin: 0; padding: 0; outline: none;
  }

  /* ---- Menu band ---- */
  #menuband { height: 26px; flex: none; display: flex; align-items: center; padding: 0 2px 0 0; border-bottom: 1px solid #808080; box-shadow: 0 1px #fff; }
  .grip { width: 3px; align-self: stretch; flex: none; margin: 3px 5px 3px 3px; box-shadow: var(--thin); }
  #menubar { flex: 1; min-width: 0; display: flex; align-items: center; }
  .menu { height: 18px; padding: 0 6px; background: none; }
  .menu:hover, .menu:focus-visible { box-shadow: var(--thin); }
  .menu:active { box-shadow: var(--thin-down); }

  /* ---- Activity box: the lantern, scaled down ---- */
  #throbber {
    width: 40px; height: 22px; flex: none; margin-right: 1px;
    display: flex; align-items: center; justify-content: center; background: #000; box-shadow: var(--thin-down);
  }
  #throbber svg.idle { width: 14px; height: 20px; }
  #throbber .lit-box { width: 14px; height: 20px; overflow: hidden; display: none; }
  #throbber svg.lit { width: 56px; height: 20px; animation: flicker 0.6s steps(4) infinite; }
  @keyframes flicker { from { transform: translateX(0); } to { transform: translateX(-56px); } }
  #throbber.loading svg.idle { display: none; }
  #throbber.loading .lit-box { display: block; }

  /* ---- Bands ---- */
  .band { display: flex; align-items: center; min-width: 0; padding: 0 3px 0 0; border-bottom: 1px solid #808080; box-shadow: 0 1px #fff; }
  #std { height: 46px; flex: none; }
  #addrband { height: 28px; flex: none; position: relative; }

  /* ---- Flat buttons with labels ---- */
  .fb {
    height: 42px; min-width: 40px; position: relative; flex: none; padding: 0 4px; margin: 0 1px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 1px solid var(--face);
  }
  .fb svg { display: block; flex: none; }
  .fb svg.off { display: none; }
  .fb > span { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .fb:hover:not(.disabled), .fb:focus-visible:not(.disabled) { border-color: #fff #808080 #808080 #fff; }
  .fb:active:not(.disabled) { border-color: #808080 #fff #fff #808080; }
  .fb:active:not(.disabled) > * { transform: translate(1px, 1px); }
  .fb.disabled { color: #808080; text-shadow: 1px 1px #fff; }
  .fb.disabled svg.on { display: none; }
  .fb.disabled svg.off { display: block; }
  .dd::after { content: ""; position: absolute; left: calc(50% + 12px); top: 17px; border: 3px solid transparent; border-top: 3px solid currentColor; border-bottom: 0; }
  .sep { width: 2px; height: 36px; flex: none; margin: 0 3px; box-shadow: var(--thin); }

  /* ---- Address band ---- */
  #addrband > label { flex: none; padding-right: 5px; }
  #field {
    flex: 1; min-width: 0; height: 22px; padding: 2px; position: relative; display: flex; align-items: center;
    background: #fff; box-shadow: var(--sunken);
  }
  #url {
    flex: 1; min-width: 0; height: 18px; border: 0; margin: 0; padding: 1px 3px; outline: none;
    background: transparent; color: #000; font: inherit; user-select: text;
  }
  #url::selection { background: #000080; color: #fff; }
  #field > svg { flex: none; margin: 0 2px 0 1px; }
  #drop {
    width: 16px; height: 17px; flex: none; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--raised);
  }
  #drop::before { content: ""; border: 3px solid transparent; border-top: 4px solid #000; border-bottom: 0; }
  #drop:active { box-shadow: var(--sunken); }
  #go { height: 22px; margin: 0 4px 0 5px; padding: 0 6px 0 4px; flex: none; display: flex; align-items: center; gap: 3px; border: 1px solid var(--face); }
  #go:hover { border-color: #fff #808080 #808080 #fff; }
  #go:active { border-color: #808080 #fff #fff #808080; }
  #go svg { display: block; }
  #go svg.off { display: none; }

  /* ---- Links band: collapsed, opens on hover ---- */
  #linksband { width: 64px; height: 100%; flex: none; display: flex; align-items: center; position: relative; border-left: 1px solid #fff; box-shadow: -1px 0 #808080; }
  #linksband > label { padding: 0 2px 0 0; }
  #linksband .grip { margin-left: 4px; }
  #links {
    display: none; position: absolute; right: 0; top: 0; height: 28px; width: 360px; max-width: 70vw; z-index: 2;
    align-items: center; gap: 2px; padding: 0 4px; overflow: hidden; background: var(--face); box-shadow: var(--thin);
  }
  #linksband:hover #links, #linksband:focus-within #links { display: flex; }
  .ql {
    height: 18px; max-width: 120px; flex: none; padding: 0 5px 0 3px;
    display: flex; align-items: center; gap: 3px;
  }
  .ql:hover { box-shadow: var(--thin); }
  .ql:active { box-shadow: var(--thin-down); }
  .ql:active > * { transform: translate(1px, 1px); }
  .ql:focus-visible { outline: 1px dotted #000; outline-offset: -3px; }
  .ql svg { flex: none; }
  .ql span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #links .none { color: #808080; text-shadow: 1px 1px #fff; white-space: nowrap; }
</style>
</head>
<body>
  <div id="menuband">
    <div class="grip"></div>
    <div id="menubar">
      <button class="menu" data-cmd="menu" data-arg="file" data-anchor aria-haspopup="menu"><u>F</u>ile</button>
      <button class="menu" data-cmd="menu" data-arg="edit" data-anchor aria-haspopup="menu"><u>E</u>dit</button>
      <button class="menu" data-cmd="menu" data-arg="view" data-anchor aria-haspopup="menu"><u>V</u>iew</button>
      <button class="menu" data-cmd="menu" data-arg="favorites" data-anchor aria-haspopup="menu">F<u>a</u>vorites</button>
      <button class="menu" data-cmd="menu" data-arg="tools" data-anchor aria-haspopup="menu"><u>T</u>ools</button>
      <button class="menu" data-cmd="menu" data-arg="help" data-anchor aria-haspopup="menu"><u>H</u>elp</button>
    </div>
    <div id="throbber" title="About Lantern" role="button" aria-label="About Lantern">
      {{LANTERN_IDLE}}
      <div class="lit-box">{{LANTERN_LIT}}</div>
    </div>
  </div>
  <div class="band" id="std">
    <div class="grip"></div>
    <button class="fb disabled" id="back" data-cmd="back" title="Go back (Alt+Left)">{{ICON_D99_BACK}}<span class="dd">Back</span></button>
    <button class="fb disabled" id="forward" data-cmd="forward" title="Go forward (Alt+Right)">{{ICON_D99_FORWARD}}<span class="dd">Forward</span></button>
    <button class="fb disabled" id="stop" data-cmd="stop" title="Stop loading (Esc)">{{ICON_D99_STOP}}<span>Stop</span></button>
    <button class="fb" id="reload" data-cmd="reload" title="Refresh this page (F5)">{{ICON_D99_RELOAD}}<span>Refresh</span></button>
    <button class="fb" id="home" data-cmd="home" title="Go to the start page (Alt+Home)">{{ICON_D99_HOME}}<span>Home</span></button>
    <div class="sep"></div>
    <button class="fb" id="search" data-cmd="search" title="Search the web">{{ICON_D99_SEARCH}}<span>Search</span></button>
    <button class="fb" id="favorites" data-cmd="bookmarks" title="Show your favorites">{{ICON_D99_FAVORITES}}<span>Favorites</span></button>
    <button class="fb" id="history" title="History">{{ICON_D99_HISTORY}}<span>History</span></button>
    <div class="sep"></div>
    <button class="fb" id="mail" title="Mail and news">{{ICON_D99_MAIL}}<span class="dd">Mail</span></button>
    <button class="fb" id="print" data-cmd="print" title="Print this page (Ctrl+P)">{{ICON_D99_PRINT}}<span>Print</span></button>
  </div>
  <div class="band" id="addrband">
    <div class="grip"></div>
    <label for="url">Address</label>
    <div id="field">{{ICON_PAGE}}<input id="url" type="text" spellcheck="false" autocomplete="off" title="Address (Ctrl+L)"><button id="drop" data-cmd="focus-url" title="Type an address (Ctrl+L)" aria-label="Type an address"></button></div>
    <button id="go" title="Go to this address (Enter)">{{ICON_D99_GO}}<span>Go</span></button>
    <div id="linksband">
      <div class="grip"></div>
      <label>Links &raquo;</label>
      <div id="links"></div>
    </div>
  </div>
  <template id="page-icon">{{ICON_PAGE}}</template>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
