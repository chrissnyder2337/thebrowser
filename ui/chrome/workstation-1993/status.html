<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Workstation (1993): the meter, status text and Stop over a Search Keyword
     row and the row of text buttons that sat under the page
     (docs/ui-modes/modes.md). -->
<style>
  :root {
    --face: #b3b3b3;
    --up: inset 2px 2px #e4e4e4, inset -2px -2px #5a5a5a;
    --down: inset 2px 2px #5a5a5a, inset -2px -2px #e4e4e4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 13px Helvetica, "Helvetica Neue", Arial, sans-serif;
    cursor: default;
  }
  body {
    display: flex; flex-direction: column; gap: 5px; padding: 5px 8px 6px;
    box-shadow: inset 2px 0 #e4e4e4, inset -2px -2px #5a5a5a;
  }
  button {
    font: inherit; color: inherit; background: var(--face);
    border: 0; margin: 0; padding: 0; outline: none;
  }

  /* ---- Status line: meter, text, Stop ---- */
  #line { height: 24px; flex: none; display: flex; gap: 4px; }
  .pane { height: 24px; flex: none; display: flex; align-items: center; padding: 0 6px; box-shadow: var(--down); }
  #text { flex: 1; min-width: 0; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #modem-pane { gap: 5px; }
  #modem-pane:active { box-shadow: var(--up); }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
  #meter-pane { width: 130px; padding: 4px 5px; order: -1; }
  #meter { width: 100%; height: 14px; display: flex; gap: 2px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 10px; height: 14px; flex: none; background: #191970; }
  #lock-pane { width: 30px; justify-content: center; padding: 0; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }

  /* ---- Search Keyword row ---- */
  #search { height: 28px; flex: none; display: flex; align-items: center; gap: 8px; }
  #search .lab { width: 120px; flex: none; text-align: right; color: #7a7a7a; white-space: nowrap; font-size: 14px; }
  #kw {
    flex: 1; min-width: 0; height: 26px; text-align: left; padding: 0 8px;
    background: #a6a6a6; box-shadow: var(--down); color: #5a5a5a;
    font: 14px Courier, "Courier New", monospace;
  }

  /* ---- Buttons ---- */
  #buttons { display: flex; gap: 4px; }
  .tb { height: 24px; padding: 0 5px; color: #5a0a0a; box-shadow: var(--up); white-space: nowrap; }
  .tb:active:not(.disabled) { box-shadow: var(--down); }
  .tb:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
  .tb.disabled { color: #8a8a8a; }
</style>
</head>
<body>
  <div id="line">
    <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="10"></div></div>
    <div class="pane" id="text"><span id="msg">Ready.</span></div>
    <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
    <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
    <button class="tb disabled" id="stop" data-cmd="stop" title="Stop loading (Esc)">Stop</button>
  </div>
  <div id="search">
    <span class="lab">Search Keyword:</span>
    <button id="kw" data-cmd="search" title="Search the web"></button>
  </div>
  <div id="buttons">
    <button class="tb disabled" id="back" data-cmd="back" title="Go back (Alt+Left)">Back</button>
    <button class="tb disabled" id="forward" data-cmd="forward" title="Go forward (Alt+Right)">Forward</button>
    <button class="tb" id="home" data-cmd="home" title="Go to the start page (Alt+Home)">Home</button>
    <button class="tb" id="reload" data-cmd="reload" title="Reload this page (F5)">Reload</button>
    <button class="tb" id="open" data-cmd="focus-url" title="Type an address (Ctrl+L)">Open...</button>
    <button class="tb disabled" title="Not available">Save As...</button>
    <button class="tb disabled" title="Not available">Clone</button>
    <button class="tb disabled" title="Not available">New Window</button>
    <button class="tb disabled" title="Not available">Close Window</button>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
