<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Workspace (1997): the main window's status bar of sunken panes: message,
     progress, padlock, dial-up speed and a clock (docs/ui-modes/modes.md). -->
<style>
  :root { --face: #c0c0c0; --pane: inset 1px 1px #808080, inset -1px -1px #fff; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 11px "MS Sans Serif", Tahoma, Arial, sans-serif;
    cursor: default;
  }
  body { display: flex; gap: 2px; padding: 2px 2px 0; }
  .pane { height: 18px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; box-shadow: var(--pane); }
  #text { flex: 1; min-width: 0; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #meter-pane { width: 150px; padding: 3px; }
  #meter { width: 100%; height: 10px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 6px; height: 10px; flex: none; background: #000080; }
  #lock-pane { width: 24px; justify-content: center; padding: 0; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
  #modem-pane { min-width: 64px; }
  #modem-pane:active { box-shadow: inset 1px 1px #fff, inset -1px -1px #808080; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
  #clock-pane { width: 64px; justify-content: center; white-space: nowrap; }
</style>
</head>
<body>
  <div class="pane" id="text"><span id="msg">Done</span></div>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="20"></div></div>
  <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
  <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
  <div class="pane" id="clock-pane" title="Clock">12:00 PM</div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
