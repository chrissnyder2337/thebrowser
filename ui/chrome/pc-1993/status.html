<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Early PC (1993): a status line of sunken fields: the status text, the
     document URL (editable; Enter opens it), and at the right tiny push
     buttons for Forward and Reload, the progress meter, lock and modem
     (docs/ui-modes/modes.md). -->
<style>
  :root { --sunk: inset 1px 1px #808080, inset -1px -1px #fff; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: #ffffe8; color: #000;
    font: 12px "MS Sans Serif", "Microsoft Sans Serif", Arial, Helvetica, sans-serif;
    cursor: default;
  }
  body { display: flex; align-items: center; gap: 3px; padding: 0 3px; border-top: 1px solid #808080; }
  button {
    font: inherit; color: inherit; background: #c0c0c0;
    border: 0; margin: 0; padding: 0; outline: none;
  }

  .pane { height: 18px; flex: none; display: flex; align-items: center; padding: 0 4px; background: #fff; box-shadow: var(--sunk); }
  #text { flex: 1 1 0; min-width: 0; background: transparent; box-shadow: none; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #field { flex: 2 1 0; min-width: 0; position: relative; background: transparent; box-shadow: none; }
  #url {
    width: 100%; height: 16px; border: 0; padding: 0; margin: 0; outline: none;
    background: transparent; color: #000; font: inherit; user-select: text;
  }
  #url::selection { background: #000; color: #fff; }
  #field svg.lock { display: none; }

  .push {
    height: 18px; flex: none; padding: 0 7px; border: 1px solid #000; font-weight: bold;
    box-shadow: inset 1px 1px #fff, inset -1px -1px #808080;
  }
  .push:active:not(.disabled) { box-shadow: inset 1px 1px #808080; padding: 1px 6px 0 8px; }
  .push:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
  .push.disabled { color: #808080; text-shadow: 1px 1px #fff; }

  #meter-pane { width: 62px; padding: 2px; background: #c0c0c0; }
  #meter { width: 100%; height: 12px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 5px; height: 12px; flex: none; background: #000080; }
  #lock-pane { width: 22px; justify-content: center; padding: 0; background: #c0c0c0; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
  #modem-pane { gap: 4px; background: #c0c0c0; }
  #modem-pane:active { box-shadow: inset 1px 1px #808080; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
</style>
</head>
<body>
  <div class="pane" id="text"><span id="msg">Ready.</span></div>
  <div class="pane" id="field"><input id="url" type="text" spellcheck="false" autocomplete="off" aria-label="Document URL"></div>
  <button class="push disabled" id="forward" data-cmd="forward" title="Forward (Alt+Right)">Fwd</button>
  <button class="push" id="reload" data-cmd="reload" title="Reload (F5)">Reload</button>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="10"></div></div>
  <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
  <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
