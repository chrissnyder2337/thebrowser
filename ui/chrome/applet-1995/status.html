<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Applet browser (1995): a row of icon-only round buttons under the page
     (Back, Forward, Home, Reload, Stop) with the activity box at the right,
     then the status line (docs/ui-modes/modes.md). -->
<style>
  :root {
    --face: #c0c0c0;
    --up: inset 1px 1px #fff, inset -1px -1px #404040, inset 2px 2px #dfdfdf, inset -2px -2px #808080;
    --down: inset 1px 1px #404040, inset -1px -1px #fff, inset 2px 2px #808080, inset -2px -2px #dfdfdf;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 13px Helvetica, "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
    cursor: default;
  }
  body { display: flex; flex-direction: column; box-shadow: inset 0 1px #fff; }
  button {
    font: inherit; color: inherit; background: var(--face);
    border: 0; margin: 0; padding: 0; outline: none;
  }

  /* ---- Button row ---- */
  #tools { height: 56px; flex: none; position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; }
  .ib {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px #6a6a6a, inset 2px 2px 0 #8a8a8a, inset -2px -2px 0 #e4e4e4, inset 0 0 0 4px #c0c0c0;
  }
  .ib:active:not(.disabled) { box-shadow: 0 0 0 1px #6a6a6a, inset 2px 2px 0 #e4e4e4, inset -2px -2px 0 #8a8a8a, inset 0 0 0 4px #c0c0c0; }
  .ib:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  .ib svg.off { display: none; }
  .ib.disabled svg.on { opacity: .75; }

  /* ---- Activity box ---- */
  #throbber {
    position: absolute; right: 8px; top: 2px; width: 44px; height: 52px; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--down);
  }
  #throbber .lit-box { width: 32px; height: 48px; overflow: hidden; display: none; }
  #throbber svg.lit { width: 128px; height: 48px; animation: flicker 0.6s steps(4) infinite; }
  @keyframes flicker { from { transform: translateX(0); } to { transform: translateX(-128px); } }
  #throbber.loading svg.idle { display: none; }
  #throbber.loading .lit-box { display: block; }

  /* ---- Status line ---- */
  #line { height: 26px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 6px 3px; }
  .pane { height: 22px; flex: none; display: flex; align-items: center; padding: 0 6px; box-shadow: var(--down); }
  #text { flex: 1; min-width: 0; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #modem-pane { gap: 5px; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
  #meter-pane { width: 100px; padding: 3px 4px; }
  #meter { width: 100%; height: 12px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 8px; height: 12px; flex: none; background: #000080; }
  #lock-pane { width: 26px; justify-content: center; padding: 0; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
</style>
</head>
<body>
  <div id="tools">
    <button class="ib disabled" id="back" data-cmd="back" title="Back (Alt+Left)">{{ICON_A95_BACK}}</button>
    <button class="ib disabled" id="forward" data-cmd="forward" title="Forward (Alt+Right)">{{ICON_A95_FORWARD}}</button>
    <button class="ib" id="home" data-cmd="home" title="Home (Alt+Home)">{{ICON_A95_HOME}}</button>
    <button class="ib" id="reload" data-cmd="reload" title="Reload (F5)">{{ICON_A95_RELOAD}}</button>
    <button class="ib disabled" id="stop" data-cmd="stop" title="Stop (Esc)">{{ICON_A95_STOP}}</button>
    <div id="throbber" title="About Lantern" role="button" aria-label="About Lantern">
      {{LANTERN_IDLE}}
      <div class="lit-box">{{LANTERN_LIT}}</div>
    </div>
  </div>
  <div id="line">
    <div class="pane" id="text"><span id="msg">Done</span></div>
    <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="10"></div></div>
    <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
    <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
