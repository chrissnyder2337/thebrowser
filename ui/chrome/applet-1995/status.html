<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Applet browser (1995): a thin quiet strip under the page; the status text
     itself sits in the toolbar's last line (docs/ui-modes/modes.md). -->
<style>
  :root { --face: #d6d6d6; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 11px Arial, "Liberation Sans", Helvetica, sans-serif;
    cursor: default;
  }
  body { display: flex; align-items: center; justify-content: flex-end; gap: 3px; padding: 0 3px; border-top: 1px solid #404040; }
  .pane { height: 16px; flex: none; display: flex; align-items: center; padding: 0 4px; }
  #modem-pane { gap: 4px; }
  #modem-pane svg { height: 11px; width: auto; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
  #meter-pane { width: 80px; padding: 3px; box-shadow: inset 1px 1px #808080, inset -1px -1px #fff; }
  #meter { width: 100%; height: 8px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 6px; height: 8px; flex: none; background: #000080; }
  #lock-pane { width: 20px; justify-content: center; padding: 0; }
  #lock-pane svg { display: none; height: 11px; width: auto; }
  #lock-pane.secure svg { display: block; }
</style>
</head>
<body>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="10"></div></div>
  <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
  <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
