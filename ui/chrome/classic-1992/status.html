<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Classic desktop (1992): the bottom edge of the screen as a plain white
     strip: status text, an Open: address field, the progress blocks and
     small System-style push buttons for the Navigate commands
     (docs/ui-modes/modes.md). -->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: #fff; color: #000;
    font: 11px Geneva, Chicago, ChicagoFLF, Charcoal, sans-serif;
    cursor: default;
  }
  body { display: flex; align-items: center; gap: 6px; padding: 0 6px; border-top: 1px solid #000; }
  button {
    font: inherit; color: inherit; background: #fff;
    border: 0; margin: 0; padding: 0; outline: none;
  }

  #text { flex: 1 1 90px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #text span { display: block; overflow: hidden; text-overflow: ellipsis; }
  #open { flex: 2 1 160px; min-width: 0; display: flex; align-items: center; gap: 4px; }
  #open label { flex: none; font: bold 11px Chicago, ChicagoFLF, Charcoal, Geneva, sans-serif; }
  #field { flex: 1; min-width: 0; height: 16px; border: 1px solid #000; background: #fff; padding: 0 3px; }
  #url {
    width: 100%; height: 14px; border: 0; padding: 0; margin: 0; outline: none;
    background: transparent; color: #000; font: inherit; user-select: text;
  }
  #url::selection { background: #000; color: #fff; }

  #meter-pane { width: 70px; height: 12px; flex: none; border: 1px solid #000; padding: 1px; }
  #meter { width: 100%; height: 8px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 5px; height: 8px; flex: none; background: #000; }
  #lock-pane { width: 12px; flex: none; display: flex; align-items: center; justify-content: center; }
  #lock-pane svg { display: none; height: 14px; width: auto; filter: grayscale(1) contrast(4); }
  #lock-pane.secure svg { display: block; }
  #modem-pane { flex: none; display: flex; align-items: center; gap: 3px; }
  #modem-pane:active { background: #000; color: #fff; }
  #modem-pane svg { height: 10px; width: auto; filter: grayscale(1) contrast(4); }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }

  #buttons { display: flex; gap: 4px; flex: none; }
  .tb {
    height: 16px; padding: 0 6px; border: 1px solid #000; border-radius: 4px;
    font: bold 11px Chicago, ChicagoFLF, Charcoal, Geneva, sans-serif; white-space: nowrap;
  }
  .tb:active:not(.disabled) { background: #000; color: #fff; }
  .tb:focus-visible { outline: 1px dotted #000; outline-offset: 1px; }
  .tb.disabled { color: #808080; border-color: #808080; }
</style>
</head>
<body>
  <div id="text"><span id="msg">Ready.</span></div>
  <div id="open">
    <label for="url">Open:</label>
    <div id="field"><input id="url" type="text" spellcheck="false" autocomplete="off"></div>
  </div>
  <div id="meter-pane" title="Progress"><div id="meter" data-blocks="12"></div></div>
  <div id="lock-pane" title="">{{ICON_LOCK}}</div>
  <div id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
  <div id="buttons">
    <button class="tb disabled" id="back" data-cmd="back" title="Back (Alt+Left)">Back</button>
    <button class="tb disabled" id="forward" data-cmd="forward" title="Next (Alt+Right)">Next</button>
    <button class="tb" id="home" data-cmd="home" title="Home (Alt+Home)">Home</button>
    <button class="tb" id="reload" data-cmd="reload" title="Reload (F5)">Reload</button>
    <button class="tb disabled" id="stop" data-cmd="stop" title="Stop (Esc)">Stop</button>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
