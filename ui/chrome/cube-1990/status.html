<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Cube workstation (1990): a quiet strip of sunken grey panes on the desktop
     below the document window (docs/ui-modes/modes.md). -->
<style>
  :root {
    --face: #aaaaaa;
    --down: inset 1px 1px #555555, inset -1px -1px #dddddd;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: #555555; color: #000;
    font: 12px Helvetica, "Helvetica Neue", Arial, sans-serif;
    cursor: default;
  }
  body { display: flex; gap: 4px; padding: 2px 10px 2px 10px; }
  .pane { height: 18px; flex: none; display: flex; align-items: center; padding: 0 6px; background: var(--face); box-shadow: var(--down); }
  #text { flex: 1; min-width: 0; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #modem-pane { gap: 5px; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
  #meter-pane { width: 110px; padding: 3px 4px; order: -1; }
  #meter { width: 100%; height: 10px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 8px; height: 10px; flex: none; background: #000; }
  #lock-pane { width: 26px; justify-content: center; padding: 0; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
</style>
</head>
<body>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="12"></div></div>
  <div class="pane" id="text"><span id="msg">Ready.</span></div>
  <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
  <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
