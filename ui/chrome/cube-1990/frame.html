<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Frame</title>
<!-- Cube workstation (1990): a document window's black title bar with the page
     title centred and a close box (docs/ui-modes/modes.md). -->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: #000; color: #fff; border-bottom: 1px solid #555;
    font: bold 13px Helvetica, "Helvetica Neue", Arial, sans-serif;
    cursor: default;
  }
  body { display: flex; align-items: center; padding: 0 5px 0 28px; }
  #title { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #close {
    width: 17px; height: 17px; flex: none; margin: 0; padding: 0; outline: none;
    background: #aaa; border: 1px solid #000; display: flex; align-items: center; justify-content: center;
    box-shadow: inset 1px 1px #fff, inset 2px 2px #ddd, inset -1px -1px #555;
  }
  #close svg { width: 9px; height: 9px; display: block; }
  #close:active { box-shadow: inset 1px 1px #555, inset 2px 2px #777, inset -1px -1px #ddd; }
  #close:focus-visible { outline: 1px dotted #fff; outline-offset: 1px; }
</style>
</head>
<body>
  <div id="title"></div>
  <button id="close" data-cmd="close-window" title="Close this window" aria-label="Close"><svg viewBox="0 0 9 9" aria-hidden="true"><path d="M1 1 L8 8 M8 1 L1 8" stroke="#000" stroke-width="1.5"/></svg></button>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
