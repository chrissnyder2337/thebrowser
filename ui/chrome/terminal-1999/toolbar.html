<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Toolbar</title>
<!-- Text terminal (1999): a text-mode menu bar over a URL prompt, both on
     the 20px lines of an 80-column terminal (docs/ui-modes/modes.md). -->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: #000; color: #c0c0c0;
    font: 15px/20px "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, "Courier New", monospace;
    cursor: default;
  }
  body { display: flex; flex-direction: column; }
  button {
    font: inherit; color: inherit; background: transparent;
    border: 0; margin: 0; padding: 0; outline: none; cursor: default;
  }

  /* ---- Menu bar ---- */
  #menubar { height: 20px; flex: none; display: flex; align-items: center; background: #000; color: #fff; }
  .menu { height: 20px; padding: 0 2ch; white-space: pre; }
  .menu:hover, .menu:focus-visible, .menu:active { background: #c0c0c0; color: #000; }
  #title {
    flex: 1; min-width: 0; text-align: right; padding: 0 1ch; color: #c0c0c0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---- URL prompt ---- */
  #prompt { height: 20px; flex: none; display: flex; align-items: center; }
  #prompt label { flex: none; white-space: pre; }
  #field { flex: 1; min-width: 0; height: 20px; display: flex; align-items: center; }
  #url {
    flex: 1; min-width: 0; height: 20px; border: 0; padding: 0; margin: 0; outline: none;
    background: transparent; color: #fff; font: inherit; user-select: text;
    caret-color: #c0c0c0; caret-shape: block;
  }
  #url::selection { background: #c0c0c0; color: #000; }
  #field.secure::after { content: "[SSL]"; flex: none; padding: 0 1ch; color: #c0c0c0; }
</style>
</head>
<body>
  <div id="menubar">
    <button class="menu" data-cmd="menu" data-arg="navigate" data-anchor aria-haspopup="menu" title="Back, forward, reload and bookmarks">File</button>
    <button class="menu" data-cmd="menu" data-arg="options" data-anchor aria-haspopup="menu" title="Retro looks, Browser UI and settings">View</button>
    <button class="menu" data-cmd="menu" data-arg="help" data-anchor aria-haspopup="menu">Help</button>
    <div id="title"></div>
  </div>
  <div id="prompt">
    <label for="url">URL: </label>
    <div id="field"><input id="url" type="text" spellcheck="false" autocomplete="off"></div>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
