<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Applet browser (1997): a plain one-line status bar; the progress meter,
     modem and lock panes are small and flat (docs/ui-modes/modes.md). -->
<style>
  :root {
    --face: #d4d4d4;
    --box: inset 0 0 0 1px #808080;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 11px Arial, "Liberation Sans", Helvetica, sans-serif;
    cursor: default;
  }
  body { display: flex; align-items: center; gap: 2px; padding: 1px 2px; border-top: 1px solid #acaa99; }
  .pane { height: 18px; flex: none; display: flex; align-items: center; padding: 0 4px; }
  #text { flex: 1; min-width: 0; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #modem-pane { gap: 4px; box-shadow: var(--box); }
  #modem-pane svg { height: 12px; width: auto; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
  #meter-pane { width: 90px; padding: 3px; box-shadow: var(--box); }
  #meter { width: 100%; height: 10px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 7px; height: 10px; flex: none; background: #000080; }
  #lock-pane { width: 22px; justify-content: center; padding: 0; box-shadow: var(--box); }
  #lock-pane svg { display: none; height: 12px; width: auto; }
  #lock-pane.secure svg { display: block; }
</style>
</head>
<body>
  <div class="pane" id="text"><span id="msg">Done</span></div>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="10"></div></div>
  <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
  <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
