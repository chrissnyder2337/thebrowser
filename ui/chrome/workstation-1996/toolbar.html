<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Toolbar</title>
<!-- Workstation (1996): a Motif menu bar, a row of icon buttons and the URL
     field, with a security box, a hotlist button and the activity box to
     their right (docs/ui-modes/modes.md). -->
<style>
  :root {
    --face: #bfbfbf;
    --up: inset 2px 2px #e4e4e4, inset -2px -2px #5a5a5a;
    --down: inset 2px 2px #5a5a5a, inset -2px -2px #e4e4e4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 13px "Courier New", Courier, monospace;
    cursor: default;
  }
  body { display: flex; flex-direction: column; box-shadow: inset 2px 2px #e4e4e4, inset -2px -2px #5a5a5a; }
  button {
    font: inherit; color: inherit; background: var(--face);
    border: 0; margin: 0; padding: 0; outline: none;
  }

  /* ---- Menu bar ---- */
  #menubar {
    height: 26px; flex: none; display: flex; align-items: center; padding: 0 10px;
    border-bottom: 2px solid #5a5a5a; box-shadow: inset 0 2px #e5e5e5;
  }
  .menu { height: 22px; padding: 0 16px 0 10px; }
  .menu:hover, .menu:focus-visible { box-shadow: var(--up); }
  .menu:active { box-shadow: var(--down); }
  #help { margin-left: auto; padding-right: 10px; }

  /* ---- Rows under the menu bar ---- */
  #rows { flex: 1; display: flex; align-items: stretch; gap: 4px; padding: 4px 6px 4px 6px; min-height: 0; }
  #left { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

  /* Icon buttons */
  #tools { height: 32px; flex: none; display: flex; align-items: center; gap: 0; }
  #grip { width: 8px; height: 32px; flex: none; margin-right: 3px; border-left: 2px dotted #5a5a5a; }
  .ib {
    width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--up);
  }
  .ib:active:not(.disabled) { box-shadow: var(--down); padding: 2px 0 0 2px; }
  .ib.inert { cursor: default; }
  .ib:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  .ib svg { width: 22px; height: 22px; }
  .ib svg.off, .ib.disabled svg.on { display: none; }
  .ib.disabled svg.off, .ib.inert svg.on { display: block; }
  .ib.inert svg.off { display: none; }

  /* URL row */
  #urlrow { flex: 1; display: flex; align-items: center; gap: 8px; min-height: 0; }
  .lab { flex: none; color: #000; padding-left: 2px; }
  #field {
    flex: 1; min-width: 0; height: 24px; padding: 3px 6px; position: relative;
    background: #f4f4f4; box-shadow: var(--down);
  }
  #url {
    width: 100%; height: 18px; border: 0; padding: 0; margin: 0; outline: none;
    background: transparent; color: #000; font: 13px Courier, "Courier New", monospace; user-select: text;
  }
  #url::selection { background: #191970; color: #fff; }
  #title { display: none; }

  /* ---- Security box and hotlist button ---- */
  #side { width: 36px; flex: none; display: flex; flex-direction: column; gap: 0; }
  #side > * { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; box-shadow: var(--up); }
  #sec { position: relative; flex-direction: column; font: 12px "Times New Roman", Times, serif; color: #0000cc; line-height: 1; gap: 2px; }
  #sec svg { width: 13px; height: 16px; }
  #sec .ssl, body:has(#field.secure) #sec .none { display: none; }
  body:has(#field.secure) #sec .ssl { display: inline; }
  #sec svg, #hot svg.off { display: none; }
  #sec svg.off { display: none !important; }
  body:has(#field.secure) #sec svg { display: block; }
  #hot:active { box-shadow: var(--down); }
  #hot svg { width: 24px; height: 24px; }
  #hot svg.off { display: none; }

  /* ---- Activity box ---- */
  #throbber { width: 66px; flex: none; display: flex; align-items: center; justify-content: center; box-shadow: var(--up); }
  #throbber:active { box-shadow: var(--down); }
  #throbber .lit-box { width: 32px; height: 48px; overflow: hidden; display: none; }
    #throbber svg.lit { width: 128px; height: 48px; animation: flicker 0.6s steps(4) infinite; }
  @keyframes flicker { from { transform: translateX(0); } to { transform: translateX(-128px); } }
  #throbber.loading svg.idle { display: none; }
  #throbber.loading .lit-box { display: block; }
</style>
</head>
<body>
  <div id="menubar">
    <button class="menu" data-cmd="menu" data-arg="file" data-anchor aria-haspopup="menu"><u>F</u>ile</button>
    <button class="menu" data-cmd="menu" data-arg="options" data-anchor aria-haspopup="menu" title="Retro looks, Browser UI and settings"><u>O</u>ptions</button>
    <button class="menu" data-cmd="menu" data-arg="navigate" data-anchor aria-haspopup="menu"><u>N</u>avigate</button>
    <button class="menu" data-cmd="menu" data-arg="annotate" data-anchor aria-haspopup="menu"><u>A</u>nnotate</button>
    <button class="menu" data-cmd="menu" data-arg="news" data-anchor aria-haspopup="menu">N<u>e</u>ws</button>
    <button class="menu" id="help" data-cmd="menu" data-arg="help" data-anchor aria-haspopup="menu"><u>H</u>elp</button>
  </div>
  <div id="rows">
    <div id="left">
      <div id="tools">
        <span id="grip"></span>
        <button class="ib disabled" id="back" data-cmd="back" title="Go back (Alt+Left)">{{ICON_W96_BACK}}</button>
        <button class="ib disabled" id="forward" data-cmd="forward" title="Go forward (Alt+Right)">{{ICON_W96_FORWARD}}</button>
        <button class="ib" id="reload" data-cmd="reload" title="Reload this page (F5)">{{ICON_W96_RELOAD}}</button>
        <button class="ib" id="home" data-cmd="home" title="Go to the start page (Alt+Home)">{{ICON_W96_HOME}}</button>
        <button class="ib" id="open" data-cmd="focus-url" title="Open a URL (Ctrl+L)">{{ICON_W96_OPEN}}</button>
        <button class="ib inert disabled" title="Save As (not available)">{{ICON_W96_SAVE}}</button>
        <button class="ib inert disabled" title="Clone window (not available)">{{ICON_W96_CLONE}}</button>
        <button class="ib inert disabled" title="Close window (not available)">{{ICON_W96_CLOSE}}</button>
        <button class="ib inert disabled" title="Find in document (not available)">{{ICON_W96_FIND}}</button>
        <button class="ib" id="print" data-cmd="print" title="Print">{{ICON_W96_PRINT}}</button>
        <button class="ib inert disabled" title="Newsgroups (not available)">{{ICON_W96_NEWS}}</button>
      </div>
      <div id="urlrow">
        <label class="lab" for="url">URL:</label>
        <div id="field"><input id="url" type="text" spellcheck="false" autocomplete="off"></div>
        <span id="title"></span>
      </div>
    </div>
    <div id="side">
      <div id="sec" title="Security of this page"><span class="none">None</span><span class="ssl">SSL</span>{{ICON_LOCK}}</div>
      <button id="hot" data-cmd="bookmarks" title="Hotlist">{{ICON_W96_HOTLIST}}</button>
    </div>
    <div id="throbber" title="About Lantern" role="button" aria-label="About Lantern">
      {{LANTERN_IDLE}}
      <div class="lit-box">{{LANTERN_LIT}}</div>
    </div>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
