<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Frame</title>
<!-- Classic desktop (1999): the top of the document window: a Platinum title
     bar with close, zoom and collapse boxes, the big colour icon buttons (Back,
     Forward, Reload, Stop | Home, Hotlist, Print | Smaller, Larger) with the
     activity box at the right, the URL row with a Search field, and the
     Hotlist link bar (docs/ui-modes/modes.md). -->
<style>
  :root { --face: #ddd; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 10px Geneva, "Lucida Grande", Helvetica, Arial, sans-serif;
    cursor: default;
  }
  body { display: flex; flex-direction: column; }
  button {
    font: inherit; color: inherit; background: transparent;
    border: 0; margin: 0; padding: 0; outline: none; border-radius: 0;
  }

  /* ---- Title bar ---- */
  #tbar { height: 22px; flex: none; position: relative; background: var(--face); border-bottom: 1px solid #000; box-shadow: inset 0 1px #fff; }
  #tbar::before {
    content: ""; position: absolute; left: 4px; right: 4px; top: 4px; height: 13px;
    background: repeating-linear-gradient(#fff 0 1px, #777 1px 2px);
  }
  #tbar .box {
    position: absolute; top: 4px; width: 13px; height: 13px; background: var(--face);
    border: 1px solid #555; box-shadow: inset 1px 1px #fff, inset -1px -1px #999, 0 0 0 2px var(--face);
  }
  #close { left: 8px; }
  #zoom { right: 28px; }
  #collapse { right: 8px; }
  #zoom::after { content: ""; position: absolute; left: 2px; top: 2px; width: 5px; height: 5px; border: 1px solid #555; }
  #collapse::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 1px; background: #555; }
  #tcap {
    position: absolute; left: 50%; top: 2px; height: 17px; transform: translateX(-50%);
    max-width: calc(100% - 120px); padding: 0 10px; background: var(--face);
    font: bold 12px/17px Charcoal, Chicago, ChicagoFLF, Geneva, sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #title { display: inline; }

  /* ---- Icon button row ---- */
  #tools { height: 50px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px 0 6px; border-bottom: 2px solid #888; box-shadow: 0 1px #fff; }
  .tb {
    flex: none; width: 52px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    border: 1px solid transparent; border-radius: 3px; white-space: nowrap;
  }
  .tb:hover:not(.disabled) { border-color: #aaa; background: #e8e8e8; }
  .tb:active:not(.disabled) { background: #bbb; border-color: #777; }
  .tb:focus-visible { outline: 1px dotted #000; outline-offset: -3px; }
  .tb svg.off, .tb.disabled svg.on { display: none; }
  .tb.disabled svg.off { display: block; }
  .tb { font-weight: bold; }
  .tb.disabled { color: #999; font-weight: normal; }
  .sep { flex: none; width: 1px; height: 38px; margin: 0 6px; background: repeating-linear-gradient(#888 0 1px, transparent 1px 3px); }
  .gap { flex: 1; }
  #throbber { width: 44px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #b4cfe8; border: 0; }
  #throbber .lit-box { width: 32px; height: 48px; overflow: hidden; display: none; }
  #throbber .lit-box, #throbber svg.idle { zoom: 0.55; }
  #throbber svg.lit { width: 128px; height: 48px; animation: flicker 0.6s steps(4) infinite; }
  @keyframes flicker { from { transform: translateX(0); } to { transform: translateX(-128px); } }
  #throbber.loading svg.idle { display: none; }
  #throbber.loading .lit-box { display: block; }

  /* ---- URL row ---- */
  #urlrow { height: 26px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 8px; }
  #urlrow label { flex: none; }
  #field { flex: 1; min-width: 0; height: 20px; display: flex; align-items: center; gap: 4px; padding: 0 3px 0 7px; background: #fff; border: 1px solid #555; border-radius: 10px; box-shadow: inset 1px 1px #999, 0 1px #fff; }
  #url {
    flex: 1; min-width: 0; height: 16px; border: 0; padding: 0; margin: 0; outline: none;
    background: transparent; color: #000; font: 11px Geneva, "Lucida Grande", Helvetica, Arial, sans-serif; user-select: text;
  }
  #url::selection { background: #3a4a8c; color: #fff; }
  #field > svg { flex: none; }
  #field svg.lock, #field.secure svg.pg { display: none; }
  #field.secure svg.lock { display: block; }
  .rb { flex: none; display: block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid #777; background: radial-gradient(circle at 40% 35%, #fff, #bbb); position: relative; }
  .rb::after { content: ""; position: absolute; left: 4px; top: 3px; border: 3px solid transparent; border-left: 4px solid #555; border-right: 0; }
  .rb.sm { width: 12px; height: 12px; }
  .rb.sm::after { left: 3px; top: 2px; }
  #search { flex: none; width: 190px; height: 20px; display: flex; align-items: center; gap: 4px; padding: 0 3px 0 4px; text-align: left; color: #777; background: #fff; border: 1px solid #555; border-radius: 10px; box-shadow: inset 1px 1px #999, 0 1px #fff; white-space: nowrap; }
  #search .eng { flex: none; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f9a8d0, #b0307a); border: 1px solid #703; }
  #search .arr { flex: none; color: #555; font-size: 9px; }
  #search .ph { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: center; }

  /* ---- Hotlist link bar ---- */
  #quick { height: 22px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; background: var(--face); border-top: 1px solid #fff; border-bottom: 1px solid #999; }
  #links { display: flex; gap: 10px; min-width: 0; overflow: hidden; }
  #more { flex: none; padding-left: 6px; font-size: 12px; color: #333; }
  #icons { height: 20px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: #ddd; border-bottom: 1px solid #999; }
  #icons svg { flex: none; width: 10px; height: 10px; fill: none; stroke: #99a; stroke-width: 1.2; opacity: 0.9; }
  #icons svg .f { fill: #aab; stroke: none; }
  #icons .gap { flex: 1.2; }
  #icons .gap2 { flex: 1; }
  #icons em { flex: none; font-style: normal; font-size: 9px; color: #3a4a8c; }
  .ql { height: 18px; max-width: 140px; flex: none; padding: 0 3px; display: flex; align-items: center; gap: 3px; border-radius: 3px; }
  .ql:hover { background: #bbb; }
  .ql:focus-visible { outline: 1px dotted #000; outline-offset: -3px; }
  .ql svg { flex: none; }
  .ql span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #links .none { color: #666; }
</style>
</head>
<body>
  <div id="tbar">
    <span class="box" id="close" title="Close"></span>
    <span id="tcap"><span id="title"></span></span>
    <span class="box" id="zoom"></span>
    <span class="box" id="collapse"></span>
  </div>
  <div id="tools">
    <button class="tb disabled" id="back" data-cmd="back" title="Go back (Alt+Left)" aria-label="Back">{{ICON_C99_BACK}}<span>Back</span></button>
    <button class="tb disabled" id="forward" data-cmd="forward" title="Go forward (Alt+Right)" aria-label="Forward">{{ICON_C99_FORWARD}}<span>Forward</span></button>
    <button class="tb" id="reload" data-cmd="reload" title="Reload this page (F5)" aria-label="Reload">{{ICON_C99_RELOAD}}<span>Reload</span></button>
    <button class="tb disabled" id="stop" data-cmd="stop" title="Stop loading (Esc)" aria-label="Stop">{{ICON_C99_STOP}}<span>Stop</span></button>
    <span class="sep"></span>
    <button class="tb" id="home" data-cmd="home" title="Go to the start page (Alt+Home)" aria-label="Home">{{ICON_C99_HOME}}<span>Home</span></button>
    <button class="tb" id="hotlist" data-cmd="bookmarks" title="Show the Hotlist" aria-label="Hotlist">{{ICON_C99_HOTLIST}}<span>Hotlist</span></button>
    <button class="tb" id="print" data-cmd="print" title="Print this page" aria-label="Print">{{ICON_C99_PRINT}}<span>Print</span></button>
    <span class="sep"></span>
    <button class="tb" id="smaller" data-cmd="zoom-out" title="Smaller text" aria-label="Smaller">{{ICON_C99_SMALLER}}<span>Smaller</span></button>
    <button class="tb" id="larger" data-cmd="zoom-in" title="Larger text" aria-label="Larger">{{ICON_C99_LARGER}}<span>Larger</span></button>
    <span class="gap"></span>
    <div id="throbber" title="About Lantern" role="button" aria-label="About Lantern">
      {{LANTERN_IDLE}}
      <div class="lit-box">{{LANTERN_LIT}}</div>
    </div>
  </div>
  <div id="urlrow">
    <label for="url">URL:</label>
    <div id="field">{{ICON_PAGE}}{{ICON_LOCK}}<input id="url" type="text" spellcheck="false" autocomplete="off"><span class="rb" aria-hidden="true"></span></div>
    <button id="search" data-cmd="search" title="Search the web"><span class="eng"></span><span class="arr">&#9662;</span><span class="ph">Search</span><span class="rb sm"></span></button>
  </div>
  <div id="quick">
    <div id="links"></div>
    <span id="more">&raquo;</span>
    <template id="page-icon">{{ICON_PAGE}}</template>
  </div>
  <div id="icons" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4"/></svg><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4"/></svg><svg viewBox="0 0 10 10"><path d="M8 5a3 3 0 1 1-1-2.2"/><path class="f" d="M9 1v4H5z"/></svg><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2 2 8"/></svg><svg viewBox="0 0 10 10"><path d="M1 5l4-4 4 4M2 5v4h6V5"/></svg><svg viewBox="0 0 10 10"><path d="M2 1h4l2 2v6H2z"/></svg><svg viewBox="0 0 10 10"><path d="M2 4V1h6v3M1 4h8v4H1zM3 6h4v3H3z"/></svg><span class="gap"></span><em>&#9660;</em><span class="gap2"></span><svg viewBox="0 0 10 10"><path class="f" d="M5 1l1.2 2.8 2.8.2-2.2 1.9.7 2.8L5 7.2 2.5 8.7l.7-2.8L1 4l2.8-.2z"/></svg><svg viewBox="0 0 10 10"><circle cx="4" cy="4" r="2.8"/><path d="M6 6l3 3"/></svg><svg viewBox="0 0 10 10"><path d="M1 9 5 1l4 8M3 6h4"/></svg><svg viewBox="0 0 10 10"><path d="M1 3h3l1 1h4v5H1z"/></svg><svg viewBox="0 0 10 10"><path d="M1 2h8v6H1zM1 3l4 3 4-3"/></svg></div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
