<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Toolbar</title>
<!-- Desktop (1995): a menu bar over one row of small icon-only buttons with
     flat raised bevels, then the Address row, with the activity box at the
     right spanning both rows (docs/ui-modes/modes.md). -->
<style>
  :root {
    --face: #c0c0c0;
    --thin: inset 1px 1px #fff, inset -1px -1px #808080;
    --thin-down: inset 1px 1px #808080, inset -1px -1px #fff;
    --sunken: inset 1px 1px #808080, inset -1px -1px #fff, inset 2px 2px #000, inset -2px -2px #dfdfdf;
    --raised: inset 1px 1px #fff, inset -1px -1px #000, inset 2px 2px #dfdfdf, inset -2px -2px #808080;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 11px "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Arial, sans-serif;
    cursor: default;
  }
  body { display: flex; flex-direction: column; }
  button {
    font: inherit; color: inherit; background: var(--face);
    border: 0; margin: 0; padding: 0; outline: none;
  }

  /* ---- Menu bar ---- */
  #menubar { height: 20px; flex: none; display: flex; align-items: center; padding: 0 2px; }
  .menu { height: 18px; padding: 0 6px; background: none; }
  .menu:hover, .menu:focus-visible { box-shadow: var(--thin); }
  .menu:active { box-shadow: var(--thin-down); }

  /* ---- Rows ---- */
  #bands { height: 60px; flex: none; display: flex; border-top: 1px solid #808080; border-bottom: 1px solid #fff; box-shadow: 0 -1px #fff; }
  #stack { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #tools { height: 31px; flex: none; display: flex; align-items: center; padding: 0 4px; }
  #address { height: 27px; flex: none; display: flex; align-items: center; padding: 0 4px 2px 4px; }
  #address > label { flex: none; padding-right: 3px; }

  /* ---- Small icon buttons: always raised ---- */
  .tb { width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center; box-shadow: var(--raised); }
  .tb svg { display: block; flex: none; }
  .tb svg.off { display: none; }
  .tb:active:not(.disabled) { box-shadow: var(--sunken); }
  .tb:active:not(.disabled) svg { transform: translate(1px, 1px); }
  .tb:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
  .tb.disabled svg.on { display: none; }
  .tb.disabled svg.off { display: block; }
  .sep { width: 6px; height: 24px; flex: none; }

  /* ---- Address row ---- */
  #field {
    flex: 1; min-width: 0; height: 22px; padding: 2px; position: relative; display: flex;
    background: #fff; box-shadow: var(--sunken);
  }
  #url {
    flex: 1; min-width: 0; height: 18px; border: 0; margin: 0; padding: 1px 3px; outline: none;
    background: transparent; color: #000; font: inherit; user-select: text;
  }
  #url::selection { background: #000080; color: #fff; }
  #field svg.lock { display: none; flex: none; margin: 3px 4px 0 0; }
  #field.secure svg.lock { display: block; }
  #drop {
    width: 16px; height: 18px; flex: none; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--raised);
  }
  #drop::before { content: ""; border: 3px solid transparent; border-top: 4px solid #000; border-bottom: 0; }
  #drop:active { box-shadow: var(--sunken); }

  /* ---- Activity box ---- */
  #act { width: 56px; flex: none; display: flex; padding: 3px 4px 3px 2px; }
  #throbber {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; box-shadow: var(--thin-down);
  }
  #throbber .lit-box { width: 32px; height: 48px; overflow: hidden; display: none; }
  #throbber svg.lit { width: 128px; height: 48px; animation: flicker 0.6s steps(4) infinite; }
  @keyframes flicker { from { transform: translateX(0); } to { transform: translateX(-128px); } }
  #throbber.loading svg.idle { display: none; }
  #throbber.loading .lit-box { display: block; }
</style>
</head>
<body>
  <div id="menubar">
    <button class="menu" data-cmd="menu" data-arg="file" data-anchor aria-haspopup="menu"><u>F</u>ile</button>
    <button class="menu" data-cmd="menu" data-arg="edit" data-anchor aria-haspopup="menu"><u>E</u>dit</button>
    <button class="menu" data-cmd="menu" data-arg="view" data-anchor aria-haspopup="menu" title="Options, Browser UI and Retro looks"><u>V</u>iew</button>
    <button class="menu" data-cmd="menu" data-arg="go" data-anchor aria-haspopup="menu"><u>G</u>o</button>
    <button class="menu" data-cmd="menu" data-arg="favorites" data-anchor aria-haspopup="menu">F<u>a</u>vorites</button>
    <button class="menu" data-cmd="menu" data-arg="help" data-anchor aria-haspopup="menu"><u>H</u>elp</button>
  </div>
  <div id="bands">
    <div id="stack">
      <div id="tools">
        <button class="tb" id="open" data-cmd="focus-url" title="Open an address (Ctrl+L)" aria-label="Open">{{ICON_D95_OPEN}}</button>
        <button class="tb disabled" id="print" title="Print" aria-label="Print">{{ICON_D95_PRINT}}</button>
        <button class="tb disabled" id="send" title="Send" aria-label="Send">{{ICON_D95_SEND}}</button>
        <div class="sep"></div>
        <button class="tb disabled" id="back" data-cmd="back" title="Go back (Alt+Left)" aria-label="Back">{{ICON_D95_BACK}}</button>
        <button class="tb disabled" id="forward" data-cmd="forward" title="Go forward (Alt+Right)" aria-label="Forward">{{ICON_D95_FORWARD}}</button>
        <div class="sep"></div>
        <button class="tb disabled" id="stop" data-cmd="stop" title="Stop loading (Esc)" aria-label="Stop">{{ICON_D95_STOP}}</button>
        <button class="tb" id="reload" data-cmd="reload" title="Refresh this page (F5)" aria-label="Refresh">{{ICON_D95_REFRESH}}</button>
        <div class="sep"></div>
        <button class="tb" id="home" data-cmd="home" title="Go to the start page (Alt+Home)" aria-label="Home">{{ICON_D95_HOME}}</button>
        <button class="tb" id="search" data-cmd="search" title="Search the Internet" aria-label="Search">{{ICON_D95_SEARCH}}</button>
        <button class="tb disabled" id="news" title="Read newsgroups" aria-label="Read newsgroups">{{ICON_D95_NEWS}}</button>
        <div class="sep"></div>
        <button class="tb" id="favorites" data-cmd="bookmarks" title="Open your favorites" aria-label="Open Favorites">{{ICON_D95_FAVORITES}}</button>
        <button class="tb" id="add" data-cmd="bookmark-add" title="Add this page to your favorites (Ctrl+D)" aria-label="Add To Favorites">{{ICON_D95_ADD}}</button>
        <div class="sep"></div>
        <button class="tb disabled" id="font-up" title="Larger Font" aria-label="Larger Font">{{ICON_D95_FONT_UP}}</button>
        <button class="tb disabled" id="font-down" title="Smaller Font" aria-label="Smaller Font">{{ICON_D95_FONT_DOWN}}</button>
        <div class="sep"></div>
        <button class="tb disabled" id="cut" title="Cut" aria-label="Cut">{{ICON_D95_CUT}}</button>
        <button class="tb disabled" id="copy" title="Copy" aria-label="Copy">{{ICON_D95_COPY}}</button>
        <button class="tb disabled" id="paste" title="Paste" aria-label="Paste">{{ICON_D95_PASTE}}</button>
      </div>
      <div id="address">
        <label for="url">Address:</label>
        <div id="field"><input id="url" type="text" spellcheck="false" autocomplete="off" title="Address (Ctrl+L)">{{ICON_LOCK}}<button id="drop" data-cmd="focus-url" title="Type an address (Ctrl+L)" aria-label="Type an address"></button></div>
      </div>
    </div>
    <div id="act">
      <div id="throbber" title="About Lantern" role="button" aria-label="About Lantern">
        {{LANTERN_IDLE}}
        <div class="lit-box">{{LANTERN_LIT}}</div>
      </div>
    </div>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
