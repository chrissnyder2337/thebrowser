<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Toolbar (1996): a status bar of sunken panes: a key, the message, the
     progress meter and the modem (docs/ui-modes/modes.md). -->
<style>
  :root {
    --face: #c0c0c0;
    --thin-down: inset 1px 1px #808080, inset -1px -1px #fff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 11px Tahoma, "MS Sans Serif", Arial, sans-serif;
    cursor: default;
  }
  body { display: flex; gap: 2px; padding: 1px 2px 1px; }
  .pane { height: 20px; flex: none; display: flex; align-items: center; padding: 0 4px; box-shadow: var(--thin-down); }
  #lock-pane { width: 30px; justify-content: center; padding: 0; }
  #lock-pane svg { display: none; }
  #lock-pane.secure svg { display: block; }
  #text { flex: 1; min-width: 0; }
  #text span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #meter-pane { width: 172px; padding: 3px; }
  #meter { width: 100%; height: 12px; display: flex; gap: 1px; visibility: hidden; }
  #meter.on { visibility: visible; }
  #meter i { width: 8px; height: 12px; flex: none; background: #000080; }
  #modem-pane { gap: 4px; min-width: 30px; }
  #modem-pane:active { box-shadow: inset 1px 1px #000; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label { white-space: nowrap; }
</style>
</head>
<body>
  <div class="pane" id="lock-pane" title="">{{ICON_LOCK}}</div>
  <div class="pane" id="text"><span id="msg">Document: Done</span></div>
  <div class="pane" id="meter-pane" title="Progress"><div id="meter" data-blocks="18"></div></div>
  <div class="pane" id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
