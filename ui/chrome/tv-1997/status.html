<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Set-top TV (1997): the same charcoal-and-gold bar as 1996 (title, progress,
     Options key); with html.panel-open the Options panel grows above it: a
     stack of main keys on the left, a row of pictogram tiles on the right, a
     "Now showing" screen and the Go to field (docs/ui-modes/modes.md). -->
<style>
  :root { --gold: #e1c433; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: #202020; color: var(--gold);
    font: 16px Helvetica, "Helvetica Neue", Arial, sans-serif; cursor: default;
  }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; outline: none; cursor: default; }
  svg { display: block; }

  /* ---- Keys: dark rounded tiles with gold labels ---- */
  .key {
    display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; border-radius: 6px;
    color: var(--gold); font-weight: bold; font-size: 14px;
    background: linear-gradient(#666, #444 50%, #333); border: 1px solid #222;
    box-shadow: 0 2px 3px rgba(0, 0, 0, .6), inset 0 1px rgba(255, 255, 255, .25);
  }
  .key:active:not(.disabled):not(.inert) { transform: translateY(1px); box-shadow: 0 1px 1px rgba(0, 0, 0, .6); }
  .key:focus-visible { outline: 2px solid var(--gold); outline-offset: 0; }
  .key.disabled, .key.inert { color: #77704a; background: linear-gradient(#4a4a4a, #383838 50%, #2e2e2e); box-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
  .key svg { flex: none; width: 16px; height: 16px; }
  .key svg.off, .key.disabled svg.on, .key.inert svg.on { display: none; }
  .key.disabled svg.off, .key.inert svg.off { display: block; }

  /* ---- Options panel (closed by default) ---- */
  #panel {
    display: none; flex: 1; min-height: 0; padding: 6px 12px;
    background: linear-gradient(#2a2a2a, #202020); border-top: 1px solid #666;
  }
  html.panel-open #panel { display: grid; }
  #panel { grid-template-columns: 150px 1fr; grid-template-rows: repeat(6, 24px); gap: 3px 12px; align-content: center; }
  #stack { grid-column: 1; grid-row: 1 / 7; display: grid; grid-template-rows: repeat(6, 24px); gap: 3px; }
  #stack .key { padding: 0 10px; }
  #tiles { grid-column: 2; grid-row: 1 / 3; display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  #tiles .key { flex-direction: column; justify-content: center; gap: 3px; padding: 0 1px; font-size: 11px; }
  #screen {
    grid-column: 2; grid-row: 3 / 6; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 14px; min-width: 0;
    background: #0c0c0c; border-radius: 8px; box-shadow: inset 0 2px 4px #000, 0 1px rgba(255, 255, 255, .15);
  }
  #screen small { font-size: 11px; color: #9a9a9a; }
  #screen b { font-size: 16px; color: var(--gold); font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #field { grid-column: 2; grid-row: 6; display: flex; align-items: center; gap: 8px; min-width: 0; }
  #url {
    flex: 1; min-width: 0; height: 24px; padding: 0 12px; border: 0; border-radius: 12px;
    background: #0c0c0c; color: var(--gold); font: 14px Helvetica, Arial, sans-serif; outline: none;
    box-shadow: inset 0 2px 4px #000, 0 1px rgba(255, 255, 255, .15);
  }
  #url:focus { outline: 2px solid var(--gold); }
  #go { flex: none; height: 24px; padding: 0 20px; justify-content: center; }

  /* ---- Status bar ---- */
  #bar {
    height: 34px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px;
    background: linear-gradient(#333, #202020); border-top: 1px solid #666;
  }
  #throbber { width: 20px; height: 29px; flex: none; overflow: hidden; }
  #throbber .scale { width: 32px; height: 48px; transform: scale(.6); transform-origin: 0 0; }
  #throbber .lit-box { width: 32px; height: 48px; overflow: hidden; display: none; }
  #throbber svg.lit { width: 128px; height: 48px; animation: flicker .6s steps(4) infinite; }
  @keyframes flicker { from { transform: translateX(0); } to { transform: translateX(-128px); } }
  #throbber.loading svg.idle { display: none; }
  #throbber.loading .lit-box { display: block; }
  #pill {
    flex: 1 1 auto; min-width: 0; height: 26px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
    background: #0c0c0c; border-radius: 8px; box-shadow: inset 0 2px 3px #000, 0 1px rgba(255, 255, 255, .15);
  }
  #title { flex: 1; min-width: 0; color: var(--gold); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #msgbox { flex: 0 1 150px; min-width: 0; text-align: right; font-size: 11px; color: #9a9a9a; overflow: hidden; white-space: nowrap; }
  #msg { display: block; overflow: hidden; text-overflow: ellipsis; }
  #meter {
    flex: none; width: 100px; height: 10px; display: flex; overflow: hidden; visibility: hidden;
    border-radius: 5px; background: #0c0c0c; box-shadow: inset 0 1px 2px #000, 0 1px rgba(255, 255, 255, .15);
  }
  #meter.on { visibility: visible; }
  #meter i { width: 5%; height: 10px; flex: none; background: linear-gradient(#f0d860, #b89820); }
  #status-box {
    flex: none; height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 5px;
    background: #0c0c0c; border: 1px solid #555; border-radius: 3px; position: relative;
  }
  #lock-pane, #modem-pane { flex: none; display: flex; align-items: center; gap: 4px; color: #9a9a9a; font-size: 10px; }
  #lock-pane svg, #modem-pane svg { height: 14px; width: auto; opacity: .7; }
  #lock-pane { display: none; }
  #lock-pane.secure { display: flex; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label:empty { display: none; }
  #modem-pane::after { content: ""; width: 20px; height: 2px; background: #1c1c1c; }
  #modem-pane.dialup::after { background: #00a500; }
  #opts { height: 26px; padding: 0 16px; justify-content: center; border-radius: 6px; font-size: 14px; background: linear-gradient(#555, #333); }
</style>
</head>
<body>
  <div id="panel">
    <div id="stack">
      <button class="key disabled" id="back" data-cmd="back" title="Go back (Alt+Left)">{{ICON_T97_BACK}}Back</button>
      <button class="key disabled" id="forward" data-cmd="forward" title="Go forward (Alt+Right)">{{ICON_T97_FORWARD}}Forward</button>
      <button class="key" id="home" data-cmd="home" title="Go to the start page (Alt+Home)">{{ICON_T97_HOME}}Home</button>
      <button class="key" data-cmd="search" title="Search the web">{{ICON_T97_SEARCH}}Search</button>
      <button class="key" data-cmd="bookmarks" title="Favorites">{{ICON_T97_FAVORITES}}Favorites</button>
      <button class="key" data-cmd="focus-url" title="Type an address (Ctrl+L)">{{ICON_T97_GOTO}}Go to</button>
    </div>
    <div id="tiles">
      <button class="key" data-cmd="bookmark-add" title="Save this page as a favorite (Ctrl+D)">{{ICON_T97_SAVE}}Save</button>
      <button class="key inert" title="Not available">{{ICON_T97_SEND}}Send</button>
      <button class="key inert" title="Not available">{{ICON_T97_INFO}}Info</button>
      <button class="key" data-cmd="search" title="Find on the web">{{ICON_T97_FIND}}Find</button>
      <button class="key" data-cmd="menu" data-arg="setup" data-anchor aria-haspopup="menu" title="Text size and other settings">{{ICON_T97_TEXTSIZE}}Text size</button>
      <button class="key inert" title="Not available">{{ICON_T97_PRINT}}Print</button>
      <button class="key" id="reload" data-cmd="reload" title="Reload this page (F5)">{{ICON_T97_RELOAD}}Reload</button>
      <button class="key disabled" id="stop" data-cmd="stop" title="Stop loading (Esc)">{{ICON_T97_STOP}}Stop</button>
      <button class="key" data-cmd="menu" data-arg="setup" data-anchor aria-haspopup="menu" title="Setup">{{ICON_T97_SETUP}}Setup</button>
    </div>
    <div id="screen"><small>Now showing</small><b data-title></b></div>
    <div id="field"><input id="url" type="text" spellcheck="false" autocomplete="off" title="Type an address (Ctrl+L)"><button class="key" id="go" title="Go to this address">Go</button></div>
  </div>
  <div id="bar">
    <div id="throbber" title="About Lantern" role="button" aria-label="About Lantern"><div class="scale">{{LANTERN_IDLE}}<div class="lit-box">{{LANTERN_LIT}}</div></div></div>
    <div id="pill"><span id="title"></span><div id="msgbox"><span id="msg">Ready.</span></div></div>
    <div id="meter" data-blocks="20"></div>
    <div id="status-box"><div id="lock-pane" title="">{{ICON_LOCK}}</div><div id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div></div>
    <button class="key" id="opts" data-cmd="panel" title="Options">Options</button>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
