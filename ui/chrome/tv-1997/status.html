<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Status</title>
<!-- Set-top TV (1997): the same charcoal-and-gold bar as 1996 (title, progress,
     Options key); with html.panel-open the Options panel takes the window above
     it (the page is hidden) in the style of a set-top Setup screen: a maroon rail with the lantern tile and the
     panel name, three columns of heading-and-description items, a Done key
     (docs/ui-modes/modes.md). -->
<style>
  :root { --gold: #e1c433; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: #202020; color: var(--gold);
    font: 16px Helvetica, "Helvetica Neue", Arial, sans-serif; cursor: default;
  }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; outline: none; cursor: default; }
  svg { display: block; }

  /* ---- Keys: dark rounded tiles with gold labels ---- */
  .key {
    display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; border-radius: 6px;
    color: var(--gold); font-weight: bold; font-size: 14px;
    background: linear-gradient(#666, #444 50%, #333); border: 1px solid #222;
    box-shadow: 0 2px 3px rgba(0, 0, 0, .6), inset 0 1px rgba(255, 255, 255, .25);
  }
  .key:active:not(.disabled):not(.inert) { transform: translateY(1px); box-shadow: 0 1px 1px rgba(0, 0, 0, .6); }
  .key:focus-visible { outline: 2px solid var(--gold); outline-offset: 0; }
  .key.disabled, .key.inert { color: #77704a; background: linear-gradient(#4a4a4a, #383838 50%, #2e2e2e); box-shadow: 0 1px 2px rgba(0, 0, 0, .5); }

  /* ---- Options panel (closed by default): a Setup-screen look ---- */
  #panel { display: none; flex: 1; min-height: 0; border-top: 1px solid #666; background: #3a3a3a; }
  html.panel-open #panel { display: flex; }
  #rail {
    width: 78px; flex: none; position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 10px;
    background: linear-gradient(#80606b, #6c4c58); box-shadow: inset -2px 0 3px rgba(0, 0, 0, .35);
  }
  #tile {
    width: 52px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; overflow: hidden;
    background: linear-gradient(#59525c, #2a252d); box-shadow: 0 2px 3px rgba(0, 0, 0, .5), inset 0 1px rgba(255, 255, 255, .25);
  }
  #tile .scale { width: 32px; height: 48px; transform: scale(.85); }
  #rail-name {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 28px; font-weight: bold; color: #a27d89;
    writing-mode: vertical-rl; transform: rotate(180deg); line-height: 78px; height: 100px; text-shadow: 0 1px #4e3640;
  }
  #body { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 6px 18px 6px 16px; background: linear-gradient(#444, #333); }
  #heading { flex: none; height: 22px; padding-left: 6px; color: #fff; font-size: 16px; font-weight: bold; line-height: 22px; }
  #items { flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(3, 1fr); grid-auto-flow: column; grid-template-columns: repeat(4, 1fr); column-gap: 14px; }
  .item { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 0 6px; border: 0; outline: none; text-align: left; }
  .item b { align-self: flex-start; color: #44cfd8; font-size: 14px; line-height: 15px; white-space: nowrap; padding: 0 3px; margin-left: -5px; border: 2px solid transparent; border-radius: 3px; }
  .item span { color: #fff; font-size: 11px; line-height: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item:hover:not(.disabled):not(.inert) b, .item:focus-visible b, #items:not(:hover):not(:focus-within) .item:not(.disabled):not(.item:not(.disabled) ~ .item) b { border-color: #e1c433; }
  #field:focus-within { border-color: #e1c433; }
  .item.disabled, .item.inert { opacity: .42; }
  #field { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 0 6px; border: 2px solid transparent; border-radius: 6px; }
  #field label { flex: none; color: #44cfd8; font-size: 14px; font-weight: bold; }
  #fieldrow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  #lower { flex: none; display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  #url {
    flex: 1; min-width: 0; height: 20px; padding: 0 10px; border: 0; border-radius: 10px;
    background: #0c0c0c; color: var(--gold); font: 12px Helvetica, Arial, sans-serif; outline: none;
    box-shadow: inset 0 1px 3px #000, 0 1px rgba(255, 255, 255, .15);
  }
  #go { flex: none; height: 20px; padding: 0 10px; font-size: 11px; justify-content: center; border-radius: 8px; }
  #done { flex: none; height: 26px; padding: 0 26px; justify-content: center; border-radius: 8px; color: #202020; text-shadow: none; background: linear-gradient(#e4e4e4, #a8a8a8); border-color: #666; box-shadow: 0 1px 2px rgba(0, 0, 0, .6), inset 0 1px #fff; }

  /* ---- Full screen: the window gives the open panel all its height (the
     page is hidden), so it takes a Setup page's scale: a wide rail, a big
     heading, two columns of large items ---- */
  @media (min-height: 320px) {
    #rail { width: 112px; padding-top: 18px; }
    #tile { width: 76px; height: 70px; border-radius: 16px; }
    #tile .scale { transform: scale(1.25); }
    #rail-name { font-size: 54px; line-height: 112px; height: 220px; bottom: 16px; }
    #body { padding: 22px 40px 22px 40px; text-shadow: 0 0 3px rgba(0, 0, 0, .8); }
    #heading { height: 44px; font-size: 32px; line-height: 44px; padding-left: 4px; }
    #items { margin-top: 18px; grid-template-rows: repeat(6, 1fr); grid-template-columns: repeat(2, 1fr); column-gap: 30px; }
    .item b { font-size: 22px; line-height: 26px; }
    .item span { font-size: 17px; line-height: 21px; }
    #lower { margin-top: 18px; padding-top: 16px; border-top: 2px solid #555; gap: 24px; }
    #field label { font-size: 22px; }
    #url { height: 30px; font-size: 16px; border-radius: 15px; }
    #go { height: 30px; font-size: 15px; }
    #done { height: 40px; padding: 0 40px; font-size: 20px; border-radius: 10px; }
  }

  /* ---- Status bar ---- */
  #bar {
    height: 40px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px;
    background: linear-gradient(#333, #202020); border-top: 1px solid #666;
  }
  #throbber { width: 20px; height: 29px; flex: none; overflow: hidden; }
  #throbber .scale { width: 32px; height: 48px; transform: scale(.6); transform-origin: 0 0; }
  #throbber .lit-box { width: 32px; height: 48px; overflow: hidden; display: none; }
  #throbber svg.lit { width: 128px; height: 48px; animation: flicker .6s steps(4) infinite; }
  @keyframes flicker { from { transform: translateX(0); } to { transform: translateX(-128px); } }
  #throbber.loading svg.idle { display: none; }
  #throbber.loading .lit-box { display: block; }
  #pill {
    flex: 1 1 auto; min-width: 0; height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
    background: #0c0c0c; border-radius: 8px; box-shadow: inset 0 2px 3px #000, 0 1px rgba(255, 255, 255, .15);
  }
  #title { flex: 1; min-width: 0; color: var(--gold); font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #msgbox { flex: 0 1 150px; min-width: 0; text-align: right; font-size: 11px; color: #9a9a9a; overflow: hidden; white-space: nowrap; }
  #msg { display: block; overflow: hidden; text-overflow: ellipsis; }
  #meter {
    flex: none; width: 100px; height: 10px; display: flex; overflow: hidden; visibility: hidden;
    border-radius: 5px; background: #0c0c0c; box-shadow: inset 0 1px 2px #000, 0 1px rgba(255, 255, 255, .15);
  }
  #meter.on { visibility: visible; }
  #meter i { width: 5%; height: 10px; flex: none; background: linear-gradient(#f0d860, #b89820); }
  #status-box {
    flex: none; height: 30px; display: flex; align-items: center; gap: 4px; padding: 0 5px;
    background: #0c0c0c; border: 1px solid #555; border-radius: 3px; position: relative;
  }
  #lock-pane, #modem-pane { flex: none; display: flex; align-items: center; gap: 4px; color: #9a9a9a; font-size: 10px; }
  #lock-pane svg, #modem-pane svg { height: 14px; width: auto; opacity: .7; }
  #lock-pane { display: none; }
  #lock-pane.secure { display: flex; }
  #modem-pane svg.on, #modem-pane.dialup svg.off { display: none; }
  #modem-pane.dialup svg.on { display: block; }
  #modem-label:empty { display: none; }
  #modem-pane::after { content: ""; width: 20px; height: 2px; background: #1c1c1c; }
  #modem-pane.dialup::after { background: #00a500; }
  #opts { height: 30px; padding: 0 16px; justify-content: center; border-radius: 6px; font-size: 14px; background: linear-gradient(#555, #333); }
</style>
</head>
<body>
  <div id="panel">
    <div id="rail"><div id="tile"><div class="scale">{{LANTERN_IDLE}}</div></div><div id="rail-name">Options</div></div>
    <div id="body">
      <div id="heading">Options</div>
      <div id="items">
        <button class="item disabled" id="back" data-cmd="back" title="Go back (Alt+Left)"><b>Back</b><span>The page before</span></button>
        <button class="item disabled" id="forward" data-cmd="forward" title="Go forward (Alt+Right)"><b>Forward</b><span>The next page</span></button>
        <button class="item" id="home" data-cmd="home" title="Go to the start page (Alt+Home)"><b>Home</b><span>Your start page</span></button>
        <button class="item" id="reload" data-cmd="reload" title="Reload this page (F5)"><b>Reload</b><span>Load this page again</span></button>
        <button class="item disabled" id="stop" data-cmd="stop" title="Stop loading (Esc)"><b>Stop</b><span>Stop loading</span></button>
        <button class="item" data-cmd="search" title="Search the web"><b>Search</b><span>Find on the Web</span></button>
        <button class="item" data-cmd="bookmarks" title="Favorites"><b>Favorites</b><span>Your saved pages</span></button>
        <button class="item" data-cmd="bookmark-add" title="Save this page as a favorite (Ctrl+D)"><b>Save</b><span>Save to Favorites</span></button>
        <button class="item" data-cmd="search" title="Find on the web"><b>Find</b><span>Find on this page</span></button>
        <button class="item" data-cmd="menu" data-arg="setup" data-anchor aria-haspopup="menu" title="Text size and other settings"><b>Text size</b><span>Make text big or small</span></button>
        <button class="item" data-cmd="menu" data-arg="setup" data-anchor aria-haspopup="menu" title="Setup"><b>Setup</b><span>Adjust your box</span></button>
      </div>
      <div id="lower">
        <div id="field"><label for="url">Go to</label><div id="fieldrow"><input id="url" type="text" spellcheck="false" autocomplete="off" title="Type an address (Ctrl+L)"><button class="key" id="go" title="Go to this address">Go</button></div></div>
        <button class="key" id="done" data-cmd="panel" title="Close the Options panel">Done</button>
      </div>
    </div>
  </div>
  <div id="bar">
    <div id="throbber" title="About Lantern" role="button" aria-label="About Lantern"><div class="scale">{{LANTERN_IDLE}}<div class="lit-box">{{LANTERN_LIT}}</div></div></div>
    <div id="pill"><span id="title"></span><div id="msgbox"><span id="msg">Ready.</span></div></div>
    <div id="meter" data-blocks="20"></div>
    <div id="status-box"><div id="lock-pane" title="">{{ICON_LOCK}}</div><div id="modem-pane" role="button" data-cmd="settings" title="Dial-up simulator">{{ICON_MODEM}}<span id="modem-label"></span></div></div>
    <button class="key" id="opts" data-cmd="panel" title="Options">Options</button>
  </div>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
