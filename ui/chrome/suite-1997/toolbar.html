<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Toolbar</title>
<!-- Suite (1997): a menu bar over three toolbars, each with a collapse tab:
     navigation buttons and the activity box, the location row, and the
     personal toolbar of quick links (docs/ui-modes/modes.md). -->
<style>
  :root {
    --face: #c0c0c0;
    --raised: inset 1px 1px #fff, inset -1px -1px #000, inset 2px 2px #dfdfdf, inset -2px -2px #808080;
    --pressed: inset 1px 1px #000, inset -1px -1px #fff, inset 2px 2px #808080, inset -2px -2px #dfdfdf;
    --thin-raised: inset 1px 1px #fff, inset -1px -1px #808080;
    --thin-pressed: inset 1px 1px #808080, inset -1px -1px #fff;
    --sunken: inset 1px 1px #808080, inset -1px -1px #fff, inset 2px 2px #000, inset -2px -2px #dfdfdf;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: var(--face); color: #000;
    font: 12px Helvetica, "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
    cursor: default;
  }
  body { display: flex; flex-direction: column; }
  svg { display: block; }
  svg.off { display: none; }
  button {
    font: inherit; color: inherit; background: var(--face);
    border: 0; margin: 0; padding: 0; outline: none;
  }

  /* ---- Menu bar ---- */
  #menubar { height: 24px; flex: none; display: flex; align-items: center; padding: 0 4px; border-bottom: 1px solid #808080; box-shadow: 0 1px #fff; }
  .menu { height: 20px; padding: 0 10px; }
  .menu:hover, .menu:focus-visible { box-shadow: var(--thin-raised); }
  .menu:active { box-shadow: var(--thin-pressed); }
  #help { margin-left: auto; }

  /* ---- A toolbar row: collapse tab, then its contents ---- */
  .bar { display: flex; align-items: stretch; flex: none; border-top: 1px solid #fff; border-bottom: 1px solid #808080; }
  .tab {
    width: 9px; flex: none; margin: 1px 2px 1px 1px; position: relative;
    box-shadow: var(--thin-raised);
    background: repeating-linear-gradient(0deg, #c0c0c0 0 1px, #808080 1px 2px);
    background-size: 3px 100%; background-repeat: no-repeat; background-position: 3px 0;
  }
  .tab::before {
    content: ""; position: absolute; left: 1px; top: 1px;
    border: 3px solid transparent; border-top: 4px solid #000; border-bottom: 0;
  }
  .tab:hover { background-color: #d4d4d4; }
  .tab:active { box-shadow: var(--thin-pressed); }

  /* ---- Navigation toolbar ---- */
  #nav { height: 54px; }
  #buttons { flex: 1; display: flex; align-items: center; min-width: 0; overflow: hidden; }
  .big {
    min-width: 58px; height: 48px; flex: none; padding: 0 3px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .big svg { width: 24px; height: 24px; }
  .big svg.off { display: none; }
  .big:hover:not(.disabled) { box-shadow: var(--thin-raised); }
  .big:active:not(.disabled) { box-shadow: var(--thin-pressed); }
  .big:active:not(.disabled) > * { transform: translate(1px, 1px); }
  .big:focus-visible span { outline: 1px dotted #000; }
  .big.disabled svg.on { display: none; }
  .big.disabled svg.off { display: block; }
  .big.disabled span { color: #808080; text-shadow: 1px 1px #fff; }
  .gap { flex: 1; min-width: 0; }
  #throbber {
    width: 52px; height: 48px; flex: none; margin: 0 4px 0 6px;
    display: flex; align-items: center; justify-content: center;
    background: #101010; box-shadow: var(--thin-pressed);
  }
  #throbber:active { transform: translate(1px, 1px); }
  #throbber .lit-box { width: 32px; height: 48px; overflow: hidden; display: none; }
  #throbber svg.lit { width: 128px; height: 48px; animation: flicker 0.6s steps(4) infinite; }
  @keyframes flicker { from { transform: translateX(0); } to { transform: translateX(-128px); } }
  #throbber.loading svg.idle { display: none; }
  #throbber.loading .lit-box { display: block; }

  /* ---- Location toolbar ---- */
  #loc { height: 28px; }
  #locrow { flex: 1; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 2px; min-width: 0; }
  .tbtn { height: 22px; flex: none; padding: 0 4px; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .tbtn:hover { box-shadow: var(--thin-raised); }
  .tbtn:active { box-shadow: var(--thin-pressed); }
  .tbtn:focus-visible { outline: 1px dotted #000; outline-offset: -3px; }
  .drop { width: 0; height: 0; border: 3px solid transparent; border-top: 4px solid #000; border-bottom: 0; flex: none; }
  #locicon { flex: none; }
  .lab { flex: none; }
  #field { flex: 1; min-width: 0; height: 22px; position: relative; display: flex; background: #fff; box-shadow: var(--sunken); padding: 2px; }
  #field svg.lock { position: absolute; left: 5px; top: 5px; display: none; }
  #field.secure svg.lock { display: block; }
  #url {
    flex: 1; min-width: 0; height: 18px; border: 0; outline: none; padding: 1px 3px;
    font: 12px "Courier New", Courier, "Liberation Mono", monospace; color: #000; background: transparent; user-select: text;
  }
  #field.secure #url { padding-left: 17px; }
  #url::selection { background: #000080; color: #fff; }
  #urldrop { width: 17px; height: 18px; flex: none; display: flex; align-items: center; justify-content: center; box-shadow: var(--thin-raised); }
  #urldrop .drop { border-top-width: 5px; border-left-width: 4px; border-right-width: 4px; border-top-color: #808080; }
  #urldrop:active { box-shadow: var(--thin-pressed); }

  /* ---- Personal toolbar ---- */
  #personal { height: 24px; border-bottom: 0; }
  #links { flex: 1; display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; padding-left: 2px; }
  .ql {
    height: 20px; max-width: 140px; flex: none; padding: 0 4px 0 3px;
    display: flex; align-items: center; gap: 3px;
  }
  .ql:hover { box-shadow: var(--thin-raised); }
  .ql:active { box-shadow: var(--thin-pressed); }
  .ql:active > * { transform: translate(1px, 1px); }
  .ql:focus-visible { outline: 1px dotted #000; outline-offset: -3px; }
  .ql svg { flex: none; }
  .ql svg.off { display: none; }
  .ql span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #links .none { color: #808080; text-shadow: 1px 1px #fff; }
</style>
</head>
<body>
  <div id="menubar">
    <button class="menu" data-cmd="menu" data-arg="file" data-anchor aria-haspopup="menu"><u>F</u>ile</button>
    <button class="menu" data-cmd="menu" data-arg="edit" data-anchor aria-haspopup="menu"><u>E</u>dit</button>
    <button class="menu" data-cmd="menu" data-arg="view" data-anchor aria-haspopup="menu"><u>V</u>iew</button>
    <button class="menu" data-cmd="menu" data-arg="go" data-anchor aria-haspopup="menu"><u>G</u>o</button>
    <button class="menu" data-cmd="menu" data-arg="window" data-anchor aria-haspopup="menu"><u>W</u>indow</button>
    <button class="menu" id="help" data-cmd="menu" data-arg="help" data-anchor aria-haspopup="menu"><u>H</u>elp</button>
  </div>
  <div class="bar" id="nav">
    <div class="tab" title="Show or hide the Navigation Toolbar"></div>
    <div id="buttons">
      <button class="big disabled" id="back" data-cmd="back" title="Go back (Alt+Left)">{{ICON_S97_BACK}}<span>Back</span></button>
      <button class="big disabled" id="forward" data-cmd="forward" title="Go forward (Alt+Right)">{{ICON_S97_FORWARD}}<span>Forward</span></button>
      <button class="big" id="reload" data-cmd="reload" title="Reload this page (F5)">{{ICON_S97_RELOAD}}<span>Reload</span></button>
      <button class="big" id="home" data-cmd="home" title="Go to the start page (Alt+Home)">{{ICON_S97_HOME}}<span>Home</span></button>
      <button class="big" id="search" data-cmd="search" title="Search the web">{{ICON_S97_SEARCH}}<span>Search</span></button>
      <button class="big" id="guide" title="Guide">{{ICON_S97_GUIDE}}<span>Guide</span></button>
      <button class="big" id="print" data-cmd="print" title="Print this page">{{ICON_S97_PRINT}}<span>Print</span></button>
      <button class="big" id="security" title="Security and settings">{{ICON_S97_SECURITY}}<span>Security</span></button>
      <button class="big disabled" id="stop" data-cmd="stop" title="Stop loading (Esc)">{{ICON_S97_STOP}}<span>Stop</span></button>
    </div>
    <div id="throbber" title="About Lantern" role="button" aria-label="About Lantern">
      {{LANTERN_IDLE}}
      <div class="lit-box">{{LANTERN_LIT}}</div>
    </div>
  </div>
  <div class="bar" id="loc">
    <div class="tab" title="Show or hide the Location Toolbar"></div>
    <div id="locrow">
      <button class="tbtn" id="bookmarks" data-cmd="bookmarks" title="Bookmarks">{{ICON_S97_BOOKMARKS}}<span class="drop"></span><span>Bookmarks</span></button>
      <span id="locicon">{{ICON_S97_LOC}}</span>
      <label class="lab" for="url">Location:</label>
      <div id="field">
        {{ICON_LOCK}}
        <input id="url" type="text" spellcheck="false" autocomplete="off" aria-label="Location">
        <button id="urldrop" data-cmd="focus-url" title="Type an address (Ctrl+L)"><span class="drop"></span></button>
      </div>
      <button class="tbtn" id="related" title="What's Related">{{ICON_S97_RELATED}}<span class="drop"></span><span>What's Related</span></button>
    </div>
  </div>
  <div class="bar" id="personal">
    <div class="tab" title="Show or hide the Personal Toolbar"></div>
    <div id="links"></div>
  </div>
  <template id="page-icon">{{ICON_S97_PAGE}}</template>
<script>
{{CHROME_JS}}
</script>
</body>
</html>
